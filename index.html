// Reine Logik ohne Oberfläche: Listen anlegen, Punkte zählen, nach Ruleset prüfen, Text-Export/-Import.
const L = (de, en) => LANG === 'en' ? en : de;
let lists = (store.get('aos2-lists', []) || []).filter(l => l && l.id);
const saveLists = () => store.set('aos2-lists', lists); // gibt false zurück, wenn der Browser nicht speichern kann
ws.bl = ws.bl || {};
ws.view = ['builder', 'plans', 'game'].includes(ws.view) ? ws.view : 'calc';

const kwSet = u => new Set((u && u.keywords || []).map(normKw));
const isHero = u => kwSet(u).has('hero');
const isUnique = u => kwSet(u).has('unique');
const isWarmaster = u => kwSet(u).has('warmaster');
const isWizard = u => kwSet(u).has('wizard');
const isPriest = u => kwSet(u).has('priest');
const canReinforce = u => !!u && u.def.models > 1 && !/Kann nicht verstärkt|cannot be reinforced/i.test(u.unitNote || '') && u.noReinforce !== true;
const seasonOf = u => (String(u.unitNote || '').match(/General’s Handbook (\d{4}-\d{2})/) || [])[1] || null;
const joinAsOf = u => u.joinAs || (String(u.unitNote || '').match(/Kann als (.+?) einem passenden Regiment beitreten/) || [])[1] || null;
const facUnits = fac => sharedView().units.filter(u => u.faction === fac);
const unitByName = (fac, name) => sharedView().units.find(u => u.faction === fac && u.name === name) || sharedView().units.find(u => u.faction === fac && (u.aliases || []).includes(name)) || library.find(u => u.name === name && (u.faction || '') === fac) || null;
const loosen = s => String(s || '').toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, ' ').trim();
const singular = s => s.replace(/(ies)$/, 'y').replace(/([^s])s$/, '$1');

// Passt eine Einheit auf eine Regimentsoption des Anführers?
function optMatches(opt, u) {
  const m = loosen(opt.match), n = loosen(u.name);
  if (!m) return false;
  if (m === n || singular(m) === singular(n)) return true;
  const ja = joinAsOf(u); if (ja && (loosen(ja) === m || singular(loosen(ja)) === singular(m))) return true;
  // Schlüsselwörter: „MORTEK“, „Kavalos Hero“ … alle Wörter müssen als Schlüsselwort (oder im Namen) vorkommen
  const ks = kwSet(u);
  // Helden passen nur, wenn die Option ausdrücklich Helden nennt (Name, „… Hero“ oder Beitritts-Rolle, s. o.)
  if (isHero(u) && !/\bhero/.test(m)) return false;
  if (ks.has(m) || ks.has(singular(m)) || m === loosen(u.faction)) return true;
  // Mehrere Schlüsselwörter in einer Option („Sacrosanct Chamber Cavalry“): alle Teile müssen abgedeckt sein
  let rest = ' ' + m + ' ';
  for (const k of [...ks, loosen(u.faction)].sort((a, b) => b.length - a.length)) if (k && rest.includes(' ' + k + ' ')) rest = rest.replace(' ' + k + ' ', ' ');
  return m.includes(' ') && !rest.trim();
}

const newEntry = (name) => ({ id: uid(), name, reinforced: false, enh: {} });
function newList(role = 'mine', faction = '') {
  const rs = rulesetById(null);
  return { id: uid(), name: role === 'opp' ? L('Gegnerliste', 'Opponent list') : L('Neue Liste', 'New list'), role, faction, ruleset: rs.id, limit: rs.defaultPoints || 2000,
    formation: '', aor: '', tactics: [], lores: { spell: '', prayer: '', manifestation: '' }, terrain: '', ror: '', generalId: '', regiments: [{ id: uid(), lead: null, units: [] }], aux: [], notes: '', updated: Date.now() };
}
const regEntries = r => r.lead ? [r.lead, ...r.units] : r.units;
const allEntries = l => [...l.regiments.flatMap(regEntries), ...l.aux];
const entryUnit = (l, e) => unitByName(l.faction, e.name);
// Army of Renown: ersetzt Formationen, gleichnamige Enhancement-Tabellen, Lehren und Terrain; Battle Traits kommen hinzu.
const aorOf = l => l && l.aor ? ((factionRules(l.faction) || {}).armiesOfRenown || []).find(a => a.name === l.aor) || null : null;
function effRules(l) {
  const base = factionRules(l.faction) || {}, a = aorOf(l); if (!a) return base;
  const tables = (base.enhancementTables || []).map(t => (a.enhancementTables || []).find(x => x.id === t.id) || t);
  for (const t of a.enhancementTables || []) if (!tables.includes(t)) tables.push(t);
  return { ...base, battleTraits: [...(a.battleTraits || []), ...(base.battleTraits || [])], formations: a.formations || base.formations,
    enhancementTables: tables, lores: { ...(base.lores || {}), ...(a.lores || {}) }, terrain: a.terrain || base.terrain };
}
const inAoR = (a, u) => !a || a.units.some(n => unitCanon(n) === unitCanon(u.name));
const optsFor = (l, u) => { const a = aorOf(l); return (a && a.regimentOptions && a.regimentOptions[u.name]) || u.regimentOptions; };
const findTable = (l, id) => (effRules(l).enhancementTables || []).find(t => t.id === id) || null;
const findEnh = (l, tid, name) => { const t = findTable(l, tid); return t ? t.items.find(i => i.name === name) || null : null; };
const findLore = (l, kind) => l.lores && l.lores[kind] ? ((effRules(l).lores || {})[kind] || []).find(x => x.name === l.lores[kind]) || null : null;
const findTerrain = l => l.terrain ? (effRules(l).terrain || []).find(x => x.name === l.terrain) || null : null;
const findFormation = l => l.formation ? (effRules(l).formations || []).find(x => x.name === l.formation) || null : null;
const findRoR = l => l.ror ? (rulesView().regimentsOfRenown || []).find(x => x.name === l.ror) || null : null;
const rorsFor = fac => (rulesView().regimentsOfRenown || []).filter(r => !r.factions || !r.factions.length || r.factions.includes(fac));

function entryPoints(l, e) {
  const u = entryUnit(l, e); let p = u ? (+u.points || 0) * (e.reinforced ? 2 : 1) : 0;
  for (const [tid, n] of Object.entries(e.enh || {})) { const it = n && findEnh(l, tid, n); if (it && it.points) p += +it.points; }
  return p;
}
function listPoints(l) {
  let p = allEntries(l).reduce((t, e) => t + entryPoints(l, e), 0);
  for (const k of ['spell', 'prayer', 'manifestation']) { const lo = findLore(l, k); if (lo && lo.points) p += +lo.points; }
  const te = findTerrain(l); if (te && te.points) p += +te.points;
  const r = findRoR(l); if (r && r.points) p += +r.points;
  return p;
}
const listDrops = l => l.regiments.filter(r => r.lead || r.units.length).length + l.aux.length + (l.ror ? 1 : 0);
const regimentCap = (l, r) => { const rs = rulesetById(l.ruleset), lead = r.lead; return lead && lead.id === l.generalId ? (rs.generalRegimentUnits ?? rs.regimentUnits + 1) : rs.regimentUnits; };

// ---------- Prüfung ----------
function validateList(l) {
  const rs = rulesetById(l.ruleset), fr = effRules(l), out = [];
  const err = (msg) => out.push({ lvl: 'err', msg }), warn = (msg) => out.push({ lvl: 'warn', msg }), info = (msg) => out.push({ lvl: 'info', msg });
  if (!l.faction) { err(L('Bitte eine Fraktion wählen.', 'Please pick a faction.')); return out; }
  const pts = listPoints(l);
  if (l.dataVer && typeof dataVerName === 'function' && dataVerName() && l.dataVer !== dataVerName()) info(L(`Gespeichert mit Datenstand „${l.dataVer}“, aktiv ist „${dataVerName()}“ – geprüft wird nach dem aktiven Stand.`, `Saved with data version “${l.dataVer}”, active is “${dataVerName()}” – checked against the active version.`));
  if (l.limit && pts > l.limit) err(L(`${pts - l.limit} Punkte über dem Limit (${pts}/${l.limit}).`, `${pts - l.limit} points over the limit (${pts}/${l.limit}).`));
  const regs = l.regiments.filter(r => r.lead || r.units.length);
  if (!regs.length) err(L('Mindestens ein Regiment ist Pflicht.', 'At least one regiment is required.'));
  const nReg = regs.length + (rs.rorCountsTowardMax && l.ror ? 1 : 0);
  if (rs.maxRegiments && nReg > rs.maxRegiments) err(L(`Höchstens ${rs.maxRegiments} Regimenter erlaubt${rs.rorCountsTowardMax ? ' (Regiment of Renown zählt mit)' : ''}: ${nReg}.`, `At most ${rs.maxRegiments} regiments allowed${rs.rorCountsTowardMax ? ' (Regiment of Renown counts)' : ''}: ${nReg}.`));
  let noOpts = new Set();
  let regNo = 0;
  l.regiments.forEach((r) => {
    const isG = r.lead && r.lead.id === l.generalId, no = isG ? 0 : ++regNo;
    const lbl = isG ? L('Regiment des Generals', 'General’s regiment') : `Regiment ${no}`;
    if (!r.lead && !r.units.length) return;
    if (!r.lead) { err(L(`${lbl}: Es fehlt ein Held als Anführer.`, `${lbl}: a hero is needed to lead it.`)); return; }
    const lead = entryUnit(l, r.lead);
    if (!lead) { err(L(`${lbl}: Anführer „${r.lead.name}“ nicht in den Daten.`, `${lbl}: leader “${r.lead.name}” not found in the data.`)); return; }
    if (!isHero(lead)) err(L(`${lbl}: „${lead.name}“ ist kein Held und kann kein Regiment anführen.`, `${lbl}: “${lead.name}” is not a hero and cannot lead a regiment.`));
    const cap = regimentCap(l, r), n = r.units.length;
    if (n > cap) err(L(`${lbl}: ${n} Einheiten, erlaubt sind ${cap}.`, `${lbl}: ${n} units, ${cap} allowed.`));
    const opts = optsFor(l, lead);
    const counts = (opts || []).map(() => 0);
    for (const e of r.units) {
      const u = entryUnit(l, e); if (!u) continue;
      if (opts && opts.length) {
        const i = opts.findIndex(o => optMatches(o, u));
        if (i < 0) err(L(`${lbl}: „${u.name}“ passt nicht zu den Regimentsoptionen von ${lead.name} (${opts.map(o => o.label).join(', ')}).`, `${lbl}: “${u.name}” is not a regiment option of ${lead.name} (${opts.map(o => o.label).join(', ')}).`));
        else counts[i]++;
      } else if (opts) {
        err(L(`${lbl}: ${lead.name} hat keine Regimentsoptionen und kann keine Einheiten führen.`, `${lbl}: ${lead.name} has no regiment options and cannot lead units.`));
      } else {
        noOpts.add(lead.name);
        if (isHero(u) && !joinAsOf(u)) warn(L(`${lbl}: Held „${u.name}“ in einem fremden Regiment. Das geht nur, wenn die Regimentsoptionen es erlauben.`, `${lbl}: hero “${u.name}” in another hero’s regiment. Only allowed if the regiment options say so.`));
      }
    }
    (opts || []).forEach((o, i) => {
      if (o.max != null && counts[i] > o.max) err(L(`${lbl}: höchstens ${o.max} × „${o.match}“ (${counts[i]}).`, `${lbl}: at most ${o.max} × “${o.match}” (${counts[i]}).`));
      if (o.min && counts[i] < o.min) err(L(`${lbl}: mindestens ${o.min} × „${o.match}“ nötig.`, `${lbl}: needs at least ${o.min} × “${o.match}”.`));
    });
  });
  if (noOpts.size) info(L(`Regimentsoptionen noch nicht in den Daten für: ${[...noOpts].join(', ')}. Diese Regimenter werden nur grob geprüft.`, `Regiment options not in the data yet for: ${[...noOpts].join(', ')}. These regiments are only roughly checked.`));
  const aor = aorOf(l);
  if (l.aor && !aor) warn(L(`Army of Renown „${l.aor}“ nicht in den Daten.`, `Army of Renown “${l.aor}” not in the data.`));
  if (aor) {
    const bad = allEntries(l).filter(e => { const u = entryUnit(l, e); return u && !inAoR(aor, u); }).map(e => e.name);
    if (bad.length) err(L(`Nicht Teil von „${aor.name}“: ${[...new Set(bad)].join(', ')}.`, `Not part of “${aor.name}”: ${[...new Set(bad)].join(', ')}.`));
    const req = aor.required || []; // mindestens eine der Pflicht-Einheiten (oft zwei Fassungen desselben Helden)
    if (req.length && !allEntries(l).some(e => req.some(n => unitCanon(e.name) === unitCanon(n)))) err(L(`„${aor.name}“ verlangt ${req.join(' oder ')}.`, `“${aor.name}” requires ${req.join(' or ')}.`));
    info(L(`Army of Renown „${aor.name}“: weitere Einschränkungen (z. B. Pflicht-General, Regiments of Renown, Terrain) stehen in ihren Regeln.`, `Army of Renown “${aor.name}”: further restrictions (e.g. mandatory general, Regiments of Renown, terrain) are in its rules.`));
  }
  // General & Warmaster
  const ents = allEntries(l), gen = ents.find(e => e.id === l.generalId), genU = gen && entryUnit(l, gen);
  if (!gen) err(L('Bitte einen General bestimmen.', 'Please pick a general.'));
  else if (!l.regiments.some(r => r.lead && r.lead.id === gen.id)) warn(L('Der General sollte ein Regiment anführen.', 'The general should lead a regiment.'));
  const wms = ents.filter(e => { const u = entryUnit(l, e); return u && isWarmaster(u); });
  if (wms.length && !wms.some(e => e.id === l.generalId)) err(L(`Warmaster (${wms.map(e => e.name).join(', ')}) muss General sein.`, `Warmaster (${wms.map(e => e.name).join(', ')}) must be the general.`));
  // Einheiten
  const seenU = new Map(), usedEnh = new Map(); let reinf = 0;
  for (const e of ents) {
    const u = entryUnit(l, e);
    if (!u) { err(L(`„${e.name}“ ist nicht (mehr) in den Daten.`, `“${e.name}” is not in the data (anymore).`)); continue; }
    if (isUnique(u)) { if (seenU.has(u.name)) err(L(`„${u.name}“ ist Unique und darf nur einmal vorkommen.`, `“${u.name}” is unique and can only be included once.`)); seenU.set(u.name, 1); }
    if (e.reinforced) { reinf++; if (!canReinforce(u)) err(L(`„${u.name}“ kann nicht verstärkt werden.`, `“${u.name}” cannot be reinforced.`)); }
    if (u.legends && !rs.legendsAllowed) err(L(`„${u.name}“ ist Legends und im Matched Play nicht zugelassen.`, `“${u.name}” is Legends and not allowed in Matched Play.`));
    const se = seasonOf(u); if (se && rs.season && se !== rs.season) err(L(`„${u.name}“ ist nur mit dem General’s Handbook ${se} zugelassen.`, `“${u.name}” is only legal with the General’s Handbook ${se}.`));
    for (const [tid, n] of Object.entries(e.enh || {})) {
      if (!n) continue;
      const t = findTable(l, tid), it = findEnh(l, tid, n);
      if (!it) { warn(L(`Enhancement „${n}“ nicht in den Daten.`, `Enhancement “${n}” not in the data.`)); continue; }
      if (isUnique(u)) err(L(`„${u.name}“ ist Unique und kann kein Enhancement bekommen.`, `“${u.name}” is unique and cannot take an enhancement.`));
      if (!isHero(u) && !(t && t.nonHero)) err(L(`„${u.name}“ ist kein Held und kann „${n}“ nicht bekommen.`, `“${u.name}” is not a hero and cannot take “${n}”.`));
      const rq = it.restrict || (t && t.restrict);
      if (rq && rq.keywords && rq.keywords.length && !rq.keywords.every(k => kwSet(u).has(normKw(k)))) err(L(`„${n}“ nur für ${rq.keywords.join(' ')}.`, `“${n}” only for ${rq.keywords.join(' ')}.`));
      if (rq && rq.names && rq.names.length && !rq.names.includes(u.name)) err(L(`„${n}“ nur für ${rq.names.join(', ')}.`, `“${n}” only for ${rq.names.join(', ')}.`));
      const k = tid; usedEnh.set(k, (usedEnh.get(k) || []).concat(n));
    }
  }
  for (const [tid, ns] of usedEnh) {
    const t = findTable(l, tid), lim = t && t.perArmy != null ? t.perArmy : 1;
    if (ns.length > lim) err(L(`${t ? t.name : tid}: höchstens ${lim} pro Armee (${ns.length}).`, `${t ? t.name : tid}: at most ${lim} per army (${ns.length}).`));
    const dup = ns.filter((n, i) => ns.indexOf(n) !== i); if (dup.length) err(L(`„${dup[0]}“ ist doppelt vergeben.`, `“${dup[0]}” is used twice.`));
  }
  if (rs.maxReinforced != null && reinf > rs.maxReinforced) err(L(`Höchstens ${rs.maxReinforced} verstärkte Einheiten (${reinf}).`, `At most ${rs.maxReinforced} reinforced units (${reinf}).`));
  const tacs = (l.tactics || []).filter(Boolean), maxT = rs.maxTactics ?? 2;
  if (tacs.length > maxT) err(L(`Höchstens ${maxT} Battle-Tactic-Karten (${tacs.length}).`, `At most ${maxT} battle tactic cards (${tacs.length}).`));
  if (new Set(tacs).size < tacs.length) err(L('Eine Battle-Tactic-Karte ist doppelt gewählt.', 'A battle tactic card is picked twice.'));
  for (const t of tacs) if (!(rs.battleTactics || []).some(x => x.name === t)) warn(L(`Battle Tactic „${t}“ gehört nicht zu ${rs.name}.`, `Battle tactic “${t}” is not part of ${rs.name}.`));
  // Armee-Optionen
  if ((fr.formations || []).length && !l.formation && rs.requireFormation) warn(L('Noch keine Kampfformation gewählt.', 'No battle formation picked yet.'));
  if (!fr.formations && !fr.enhancementTables) info(L('Für diese Fraktion sind noch keine Formationen, Enhancements und Lehren hinterlegt. Punkte und Regimenter werden trotzdem geprüft.', 'No formations, enhancements or lores stored for this faction yet. Points and regiments are still checked.'));
  if (ents.some(e => { const u = entryUnit(l, e); return u && isWizard(u); }) && ((fr.lores || {}).spell || []).length && !l.lores.spell) info(L('Zauberer in der Liste, aber keine Zauberlehre gewählt.', 'Wizards in the list but no spell lore picked.'));
  if (ents.some(e => { const u = entryUnit(l, e); return u && isPriest(u); }) && ((fr.lores || {}).prayer || []).length && !l.lores.prayer) info(L('Priester in der Liste, aber keine Gebetslehre gewählt.', 'Priests in the list but no prayer lore picked.'));
  const ror = findRoR(l);
  if (l.ror && !ror) warn(L(`Regiment of Renown „${l.ror}“ nicht in den Daten.`, `Regiment of Renown “${l.ror}” not in the data.`));
  if (ror && ror.factions && ror.factions.length && !ror.factions.includes(l.faction)) err(L(`„${ror.name}“ ist für ${l.faction} nicht verfügbar.`, `“${ror.name}” is not available to ${l.faction}.`));
  if (l.aux.length) info(L(`${l.aux.length} Hilfseinheit${l.aux.length === 1 ? '' : 'en'} (Auxiliary): Wer mehr davon hat, gibt dem Gegner jede Runde einen zusätzlichen Befehlspunkt.`, `${l.aux.length} auxiliary unit${l.aux.length === 1 ? '' : 's'}: the player with more of them gives the opponent an extra command point each round.`));
  return out;
}

// ---------- Text-Export im Stil der GW-App ----------
function listToText(l) {
  const fr = effRules(l), rs = rulesetById(l.ruleset), lines = [];
  const pts = listPoints(l);
  lines.push(`${l.name} ${pts}/${l.limit} pts`, '');
  lines.push(l.faction + (l.formation ? ` | ${l.formation}` : ''));
  if (l.aor) lines.push(`Army of Renown - ${l.aor}`);
  if (rs.name) lines.push(rs.name);
  lines.push(`Drops: ${listDrops(l)}`);
  if ((l.tactics || []).filter(Boolean).length) lines.push(`Battle Tactic Cards: ${l.tactics.filter(Boolean).join(', ')}`);
  const lo = { spell: 'Spell Lore', prayer: 'Prayer Lore', manifestation: 'Manifestation Lore' };
  for (const k of Object.keys(lo)) if (l.lores[k]) { const x = findLore(l, k); lines.push(`${lo[k]} - ${l.lores[k]}${x && x.points ? ` (${x.points})` : ''}`); }
  const ent = e => {
    const out = [`${e.name} (${entryPoints(l, e)})`];
    if (e.id === l.generalId) out.push('• General');
    if (e.reinforced) out.push('• Reinforced');
    for (const n of Object.values(e.enh || {})) if (n) out.push(`• ${n}`);
    return out.join('\n');
  };
  const regs = l.regiments.filter(r => r.lead || r.units.length);
  const gi = regs.findIndex(r => r.lead && r.lead.id === l.generalId);
  let n = 1;
  regs.forEach((r, i) => { lines.push('', i === gi ? "General's Regiment" : `Regiment ${n++}`); regEntries(r).forEach(e => lines.push(ent(e))); });
  if (l.aux.length) { lines.push('', 'Auxiliary Units'); l.aux.forEach(e => lines.push(ent(e))); }
  if (l.ror) { const r = findRoR(l); lines.push('', 'Regiment of Renown', `${l.ror}${r && r.points ? ` (${r.points})` : ''}`); }
  if (l.terrain) { const t = findTerrain(l); lines.push('', 'Faction Terrain', `${l.terrain}${t && t.points ? ` (${t.points})` : ''}`); }
  lines.push('', `Created with AoS Einheitenrechner`);
  return lines.join('\n');
}

// ---------- Text-Import (GW-App, eigene Exporte, andere Builder) ----------
function textToList(text, role = 'mine') {
  const lines = String(text).replace(/\r/g, '').split('\n').map(s => s.replace(/ /g, ' ').trim());
  const rep = { unknown: [], notes: [] };
  const l = newList(role, ''); l.regiments = []; l.name = '';
  const facs = sharedView().factions.map(f => f.name);
  const keyOf = s => loosen(s).replace(/^scourge of \w+:?\s*/, 'scourge ');
  // Fraktion zuerst bestimmen (Zeile mit Fraktionsnamen), sonst über die meisten Einheitentreffer
  for (const s of lines) { const f = facs.find(f => loosen(s) === loosen(f) || loosen(s).startsWith(loosen(f) + ' |') || loosen(s).startsWith(loosen(f) + ' -')); if (f) { l.faction = f; const m = s.split(/\s[|–-]\s/); if (m[1]) l.formation = m[1].trim(); break; } }
  if (!l.faction) {
    const score = new Map();
    for (const s of lines) { const m = s.match(/^(.+?)\s*\((\d+)(?:\s*pts)?\)$/i); if (!m) continue; for (const u of sharedView().units) if (loosen(u.name) === loosen(m[1])) score.set(u.faction, (score.get(u.faction) || 0) + 1); }
    l.faction = [...score].sort((a, b) => b[1] - a[1])[0]?.[0] || '';
  }
  const fr = effRules(l);
  const allEnh = (fr.enhancementTables || []).flatMap(t => t.items.map(i => ({ t, i })));
  const fixFormation = () => { if (!l.formation) return; const f = (fr.formations || []).find(x => loosen(x.name) === loosen(l.formation)); if (f) l.formation = f.name; else { rep.notes.push(L(`Formation „${l.formation}“ nicht gefunden.`, `Formation “${l.formation}” not found.`)); l.formation = ''; } };
  let sect = null, cur = null, last = null;
  for (const s of lines) {
    if (!s) continue;
    let m;
    if (!l.name && (m = s.match(/^(.+?)\s+(\d+)\s*\/\s*(\d+)\s*pts?$/i))) { l.name = m[1]; l.limit = +m[3]; continue; }
    if (!l.name && (m = s.match(/^(.+?)\s*[-–(]?\s*(\d+)\s*pts?\)?$/i)) && !/\(\d+\)$/.test(s)) { l.name = m[1].replace(/[-–(]\s*$/, '').trim(); continue; }
    if (/^general'?’?s regiment$/i.test(s)) { cur = { id: uid(), lead: null, units: [] }; l.regiments.push(cur); sect = 'reg'; cur._gen = true; continue; }
    if (/^regiment \d+$/i.test(s)) { cur = { id: uid(), lead: null, units: [] }; l.regiments.push(cur); sect = 'reg'; continue; }
    if (/^auxiliary units?$/i.test(s)) { sect = 'aux'; continue; }
    if (/^regiments? of renown$/i.test(s)) { sect = 'ror'; continue; }
    if (/^faction terrain$/i.test(s)) { sect = 'terrain'; continue; }
    if ((m = s.match(/^battle tactic(?:s| cards?)?\s*[-–:]\s*(.+)$/i))) { const all = rulesetById(l.ruleset).battleTactics || []; l.tactics = m[1].split(/\s*[,;]\s*/).map(n => (all.find(t => loosen(t.name) === loosen(n)) || {}).name || n).slice(0, 4); continue; }
    if (/^(created with|app:|data:|drops:|general'?s handbook|pitched battle|battle tactics?)/i.test(s)) continue;
    if ((m = s.match(/^(spell|prayer|manifestation)\s+lore\s*[-–:]\s*(.+?)(?:\s*\(\d+\))?$/i))) {
      const k = m[1].toLowerCase(), x = ((fr.lores || {})[k] || []).find(y => loosen(y.name) === loosen(m[2]));
      if (x) l.lores[k] = x.name; else rep.notes.push(L(`Lehre „${m[2]}“ nicht gefunden.`, `Lore “${m[2]}” not found.`));
      continue;
    }
    if ((m = s.match(/^battle formation\s*[-–:]\s*(.+)$/i))) { l.formation = m[1].trim(); continue; }
    if ((m = s.match(/^army of renown\s*[-–:]\s*(.+)$/i)) || (fr.armiesOfRenown || []).some(a => loosen(a.name) === loosen(s))) { const n = m ? m[1].trim() : s; const a = (fr.armiesOfRenown || []).find(x => loosen(x.name) === loosen(n)); if (a) l.aor = a.name; else rep.notes.push(`Army of Renown „${n}“?`); continue; }
    if (!l.formation && (fr.formations || []).some(f => loosen(f.name) === loosen(s))) { l.formation = s; continue; }
    if (facs.some(f => loosen(s) === loosen(f) || loosen(s).startsWith(loosen(f) + ' '))) continue;
    if ((m = s.match(/^[•\-*·]\s*(.+)$/))) {
      const b = m[1].trim(); if (!last) continue;
      if (/^general$/i.test(b)) l.generalId = last.id;
      else if (/^reinforced$/i.test(b)) last.reinforced = true;
      else {
        const hit = allEnh.find(x => loosen(x.i.name) === loosen(b.replace(/\s*\(\d+\)$/, '')));
        if (hit) last.enh[hit.t.id] = hit.i.name; else rep.notes.push(`${last.name}: ${b}`);
      }
      continue;
    }
    if ((m = s.match(/^(.+?)\s*\((\d+)(?:\s*pts)?\)$/i)) || sect === 'terrain' || sect === 'ror') {
      const name = m ? m[1].trim() : s;
      if (sect === 'ror') { const r = (rulesView().regimentsOfRenown || []).find(x => loosen(x.name) === loosen(name)); if (r) l.ror = r.name; else { l.ror = name; rep.notes.push(L(`Regiment of Renown „${name}“ nicht in den Daten.`, `Regiment of Renown “${name}” not in the data.`)); } continue; }
      if (sect === 'terrain') { const t = (fr.terrain || []).find(x => loosen(x.name) === loosen(name)); l.terrain = t ? t.name : name; if (!t) rep.notes.push(L(`Terrain „${name}“ nicht in den Daten.`, `Terrain “${name}” not in the data.`)); continue; }
      const u = facUnits(l.faction).find(x => loosen(x.name) === loosen(name)) || facUnits(l.faction).find(x => unitCanon(x.name) === unitCanon(name)) || facUnits(l.faction).find(x => (x.aliases || []).some(a => loosen(a) === loosen(name)));
      if (!u) { rep.unknown.push(name); last = null; continue; }
      const e = newEntry(u.name); last = e;
      if (sect === 'aux') l.aux.push(e);
      else {
        if (!cur) { cur = { id: uid(), lead: null, units: [] }; l.regiments.push(cur); sect = 'reg'; }
        if (!cur.lead && !cur.units.length && isHero(u)) cur.lead = e; else cur.units.push(e);
      }
      continue;
    }
  }
  fixFormation();
  if (!l.name) l.name = L('Importierte Liste', 'Imported list');
  if (!l.regiments.length) l.regiments.push({ id: uid(), lead: null, units: [] });
  if (!l.generalId) { const g = l.regiments.find(r => r._gen && r.lead); if (g) l.generalId = g.lead.id; }
  l.regiments.forEach(r => delete r._gen);
  return { list: l, rep };
}

function libraryHtml(cur) {

  const tree = new Map();
  for (const x of lists) {
    const f = x.faction || L('Ohne Fraktion', 'No faction'), a = x.faction ? allianceOf(x.faction) : L('Sonstige', 'Other');
    if (!tree.has(a)) tree.set(a, new Map()); const fm = tree.get(a); if (!fm.has(f)) fm.set(f, []); fm.get(f).push(x);
  }
  const order = a => { const i = ALLIANCES.indexOf(a); return i < 0 ? 99 : i; };
  const open = ws.bl.libOpen || {}, isOpen = (k, def) => open[k] ?? def;
  const curA = cur.faction ? allianceOf(cur.faction) : '';
  const row = x => `<div class="lib-row${x.id === cur.id ? ' cur' : ''}"><button class="linkname" data-libopen="${x.id}">${esc(x.name)}</button><span class="hint">${listPoints(x)}/${x.limit}${sideOf(x) === 'opp' ? ' · ' + L('Gegner', 'Opp.') : ''}</span><button class="icon" data-libdel="${x.id}" title="${L('Löschen', 'Delete')}">✕</button></div>`;
  return `<div class="bl-lib-head"><span class="hint">${L(`${lists.length} gespeicherte Listen`, `${lists.length} saved lists`)}</span><button class="small" data-bl="libCollapse">${L('Alle einklappen', 'Collapse all')}</button></div>
    <div class="bl-lib">${[...tree].sort((a, b) => order(a[0]) - order(b[0]) || a[0].localeCompare(b[0])).map(([a, fm]) => {
      const ka = 'a:' + a, n = [...fm.values()].reduce((t, xs) => t + xs.length, 0);
      return `<details class="lib-ga ga-${esc(a)}" data-libfac="${esc(ka)}"${isOpen(ka, a === curA) ? ' open' : ''}><summary>${esc(a)}<span class="count">${n}</span></summary>
        ${[...fm].sort((x, y) => x[0].localeCompare(y[0])).map(([f, xs]) => { const kf = 'f:' + f;
          return `<details class="lib-fac" data-libfac="${esc(kf)}"${isOpen(kf, f === cur.faction) ? ' open' : ''}><summary>${esc(f)}<span class="count">${xs.length}</span></summary>${xs.sort((p, q) => p.name.localeCompare(q.name, LANG)).map(row).join('')}</details>`; }).join('')}
      </details>`; }).join('')}</div>`;
}

async function offerFile(filename, text) {

      const dl = await window.claude.use('downloads');
      if (dl) { try { await dl.save({ filename, data: text }); return true; } catch (e) { if (e && e.code === 'declined') return false; if (e && e.code === 'rate_limited') { toast(L('Bitte kurz warten und erneut versuchen.', 'Please wait a moment and try again.')); return false; } } }
    }

    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); return true;
  } catch { openListBackup(); return false; }
}

// ---------- Auswertung der Liste ----------
function listCalcUnits(l, group) { return allEntries(l).map(e => entryToCalcUnit(l, e, group)).filter(Boolean).map(prepUnit); }
function withPhase(ph, fn) { const old = ws.phase; ws.phase = ph; try { return fn(); } finally { ws.phase = old; } }
function renderBlEval(l) {
  const ev = ws.bl.ev = { phase: 'all', charged: true, ...(ws.bl.ev || {}) };
  const us = listCalcUnits(l).filter(u => u._ok);
  const opp = otherList(l);
  const SV = [3, 4, 5], RD = [0, 1, 2];
  const ctx = s => ({ save: s, wq: 0, kw: new Set(), charged: !!ev.charged });
  const rows = withPhase(ev.phase, () => us.map(u => ({ u, pts: effPoints(u), dmg: SV.map(s => unitDist(u, ctx(s)).mean), ehp: RD.map(r => ehp(u, r)), hp: effModels(u) * u.def.health })));
  const sum = k => rows.reduce((t, r) => t + (Array.isArray(r[k]) ? 0 : r[k]), 0), sumA = (k, i) => rows.reduce((t, r) => t + r[k][i], 0);
  const tot = { pts: sum('pts'), hp: sum('hp'), dmg: SV.map((_, i) => sumA('dmg', i)), ehp: RD.map((_, i) => sumA('ehp', i)) };
  const per = v => tot.pts ? v / tot.pts * 100 : null;
  let html = `<div class="panel-head"><h2>${L('Auswertung der Liste', 'List analysis')}</h2>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <div class="seg" id="blEvPhase">${[['melee', L('Nahkampf', 'Melee')], ['ranged', L('Fernkampf', 'Ranged')], ['all', L('Alle', 'All')]].map(([k, t]) => `<button data-ph="${k}" class="${ev.phase === k ? 'on' : ''}">${t}</button>`).join('')}</div>
      <label class="chk"><input type="checkbox" id="blEvCharged" ${ev.charged ? 'checked' : ''}>${L('hat angegriffen', 'charged')}</label>
    </div></div>
    <div class="hint">${L('Ø Schaden gegen Rüstungswurf (ohne Ward) und effektive Lebenspunkte je Rend. Nur Waffenprofile, Charge und Anti-X; andere Fertigkeiten nicht.', 'Avg. damage vs save (no ward) and effective health per rend. Weapon profiles, Charge and Anti-X only; other abilities are not included.')}</div>
    <div class="table-wrap"><table class="evt"><thead><tr><th>${L('Einheit', 'Unit')}</th><th>${L('Pkt.', 'Pts')}</th>${SV.map(s => `<th>${L('Schaden', 'Dmg')} ${s}+</th>`).join('')}<th>${L('LP', 'Health')}</th>${RD.map(r => `<th>eLP ${r ? '−' + r : L('Rend –', 'Rend –')}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.u.name)}${r.u.reinforced ? ` <span class="hint">(${L('verstärkt', 'reinforced')})</span>` : ''}</td><td>${r.pts}</td>${r.dmg.map(v => `<td>${f1(v)}</td>`).join('')}<td>${r.hp}</td>${r.ehp.map(v => `<td>${f1(v)}</td>`).join('')}</tr>`).join('')}
    <tr class="tot"><td>${L('Summe', 'Total')}</td><td>${tot.pts}</td>${tot.dmg.map(v => `<td>${f1(v)}</td>`).join('')}<td>${tot.hp}</td>${tot.ehp.map(v => `<td>${f1(v)}</td>`).join('')}</tr>
    <tr class="tot sub"><td>${L('pro 100 Punkte', 'per 100 points')}</td><td></td>${tot.dmg.map(v => `<td>${f1(per(v))}</td>`).join('')}<td>${f1(per(tot.hp))}</td>${tot.ehp.map(v => `<td>${f1(per(v))}</td>`).join('')}</tr>
    </tbody></table></div>`;
  if (opp) {
    const ds = listCalcUnits(opp).filter(u => u._ok);
    if (ds.length && rows.length) {
      const cells = withPhase(ev.phase, () => rows.map(({ u: a }) => ds.map(d => {
        const c = { ...defCtx(d), charged: !!ev.charged }, { dist } = unitDist(a, c);
        const dm = effModels(d), hp = dm * d.def.health; let kills = 0, wipe = 0;
        dist.forEach((p, i) => { kills += p * Math.min(dm, Math.floor(i / d.def.health)); if (i >= hp) wipe += p; });
        return { kills, wipe, pts: effPoints(d) > 0 ? kills * effPoints(d) / dm : null };
      })));
      const mx = Math.max(1e-9, ...cells.flat().map(c => c.pts || 0));
      html += `<h3>${L('Gegen', 'Versus')} ${esc(opp.name)} (${esc(opp.faction || '–')})</h3>
        <div class="hint">${L('Große Zahl: Ø vernichtete gegnerische Punkte in einer Aktivierung. Klein: Chance, die Einheit auszulöschen. Schlüsselwörter der Verteidiger werden berücksichtigt.', 'Big number: avg. enemy points destroyed in one activation. Small: chance to wipe the unit. Defender keywords are applied.')}</div>
        <div class="table-wrap"><table class="matrix"><thead><tr><th>${L('Angreifer ↓ / Verteidiger →', 'Attacker ↓ / Defender →')}</th>${ds.map(d => `<th>${esc(d.name)}${d.reinforced ? ' ×2' : ''}</th>`).join('')}</tr></thead><tbody>
        ${rows.map((r, i) => `<tr><td>${esc(r.u.name)}</td>${cells[i].map(c => `<td style="background:color-mix(in srgb, var(--accent) ${Math.round((c.pts || 0) / mx * 38)}%, transparent)"><div class="big">${f1(c.pts)}</div><div class="sub">${pct(c.wipe)}</div></td>`).join('')}</tr>`).join('')}
        </tbody></table></div>`;
    }
  } else html += `<div class="hint" style="margin-top:10px">${L('Wähle rechts eine Gegnerliste, um zu sehen, wie deine Einheiten gegen ihre Einheiten abschneiden.', 'Pick an opponent list on the right to see how your units fare against theirs.')}</div>`;
  blEl('blEval').innerHTML = html;
}

// ---------- Ereignisse ----------
const findEntry = (l, id) => { for (const r of l.regiments) { if (r.lead && r.lead.id === id) return { e: r.lead, r, lead: true }; const i = r.units.findIndex(e => e.id === id); if (i >= 0) return { e: r.units[i], r, i }; } const i = l.aux.findIndex(e => e.id === id); return i >= 0 ? { e: l.aux[i], aux: true, i } : null; };
function removeEntry(l, id) {
  const f = findEntry(l, id); if (!f) return;
  if (f.lead) f.r.lead = null; else if (f.aux) l.aux.splice(f.i, 1); else f.r.units.splice(f.i, 1);
  if (l.generalId === id) l.generalId = '';
}
blEl('builderView').addEventListener('change', e => {
  const t = e.target, l = activeList();
  if (t.id === 'blPick') { ws.bl[sideKey(sideOf(l))] = t.value; saveWs(); renderBuilder(); return; }
  if (t.id === 'blEvCharged') { ws.bl.ev.charged = t.checked; saveWs(); renderBlEval(l); return; }
  if (t.dataset.lf) {
    const k = t.dataset.lf;
    if (k === 'faction' && t.value !== l.faction) {
      const nf = t.value, doIt = () => { l.faction = nf; l.regiments = [{ id: uid(), lead: null, units: [] }]; l.aux = []; l.formation = ''; l.lores = { spell: '', prayer: '', manifestation: '' }; l.terrain = ''; l.ror = ''; l.generalId = ''; touch(l); renderBuilder(); };
      t.value = l.faction;
      if (!allEntries(l).length) doIt();
      else askConfirm(L('Fraktion wechseln? Die Einheiten der Liste werden entfernt.', 'Change faction? The list’s units will be removed.'), L('Wechseln', 'Change')).then(ok => ok && doIt());
      return;
    }
    if (k === 'aor') { l.formation = ''; l.lores = { spell: '', prayer: '', manifestation: '' }; }
    l[k] = k === 'limit' ? +t.value : t.value;
    if (k === 'name' || k === 'notes') { touch(l); renderBlSide(l); return; }
  } else if (t.dataset.lore) l.lores[t.dataset.lore] = t.value;
  else if (t.dataset.tac) { l.tactics = [...(l.tactics || [])]; l.tactics[+t.dataset.tac] = t.value; l.tactics = l.tactics.map(x => x || ''); }
  else if (t.dataset.blAdd) {
    const name = t.value; if (!name) return;
    const ent = newEntry(name), rEl = t.closest('.reg'), k = t.dataset.blAdd;
    if (k === 'aux') l.aux.push(ent);
    else { const r = l.regiments[+rEl.dataset.r]; if (k === 'lead') { r.lead = ent; if (!l.generalId) l.generalId = ent.id; } else r.units.push(ent); }
  } else if (t.dataset.enh) { const f = findEntry(l, t.closest('.ent').dataset.e); if (f) f.e.enh = { ...(f.e.enh || {}), [t.dataset.enh]: t.value }; }
  else if (t.dataset.bl === 'reinf') { const f = findEntry(l, t.closest('.ent').dataset.e); if (f) f.e.reinforced = t.checked; }

// Der Wortlaut wird von jedem Nutzer selbst aus der BSData-ZIP geladen und nur in seinem Browser gespeichert
// (IndexedDB) bzw. – in der Offline-Datei – auf Wunsch in seine eigene Kopie eingebettet.
// Er wird nie in die veröffentlichte Seite geschrieben (buildPage übernimmt ihn nicht).
const RT_LINKS = {
  repo: 'https://github.com/BSData/age-of-sigmar-4th',
  zip: 'https://github.com/BSData/age-of-sigmar-4th/archive/refs/heads/main.zip',
  gwApp: 'https://www.warhammer-community.com/en-gb/articles/T53EztUV/download-the-new-warhammer-age-of-sigmar-app-now-alongside-legends-rules-and-more/',
  wahapedia: 'https://wahapedia.ru/aos4/'
};
let RT = null; // { meta, units: { key: {...} }, factions: { fac: {...} }, glossary: { key: {...} } }
const rtUnitKey = (fac, name) => fac + '|' + unitCanon(name);
function rtBuild(parsed) {
  const store = { meta: { source: 'BSData', version: parsed.meta.dataVersion || '', loaded: new Date().toISOString().slice(0, 10) }, units: {}, factions: {}, glossary: {} };
  const ab = a => ({ name: a.name, timing: a.timing, declare: a.declare || '', effect: a.effect || '', kw: a.kw || '', cast: a.cast || '', type: a.type || '' });
  for (const u of parsed.units) {
    const r = u.ref || {};
    store.units[rtUnitKey(u.faction, u.name)] = { name: u.name, move: r.move || '', control: r.control || '', banish: r.banish || '', health: u.def.health, save: u.def.save, ward: u.def.ward,
      keywords: r.keywordsAll || u.keywords, weapons: r.weapons || [], abilities: (u.abilities || []).map(ab) };
  }
  for (const [fac, fr] of Object.entries(parsed.factions || {})) {
    const f = store.factions[fac] = { battleTraits: (fr.battleTraits || []).map(ab), formations: {}, enh: {}, lores: {}, terrain: {} };
    for (const x of fr.formations || []) f.formations[srcKey(x.name)] = (x.abilities || []).map(ab);
    for (const t of fr.enhancementTables || []) for (const it of t.items) f.enh[srcKey(it.name)] = (it.abilities || []).map(ab);
    for (const k of ['spell', 'prayer', 'manifestation']) for (const l of (fr.lores || {})[k] || []) f.lores[srcKey(l.name)] = (l.items || []).map(ab);
    for (const t of fr.terrain || []) f.terrain[srcKey(t.name)] = (t.abilities || []).map(ab);
  }
  for (const [fac, fr] of Object.entries(parsed.factions || {})) for (const a of fr.armiesOfRenown || []) {
    const f = store.factions[fac]; f.aor = f.aor || {};
    const x = f.aor[srcKey(a.name)] = { battleTraits: (a.battleTraits || []).map(ab), enh: {}, lores: {}, formations: {} };
    for (const t of a.enhancementTables || []) for (const it of t.items) x.enh[srcKey(it.name)] = (it.abilities || []).map(ab);
    for (const v of Object.values(a.lores || {})) for (const lo of v) x.lores[srcKey(lo.name)] = (lo.items || []).map(ab);
    for (const fm of a.formations || []) x.formations[srcKey(fm.name)] = (fm.abilities || []).map(ab);
  }
  store.tactics = {}; for (const t of parsed.battleTactics || []) store.tactics[srcKey(t.name)] = { card: t.card || '', tiers: t.tiers };
  store.ror = {}; for (const r of parsed.regimentsOfRenown || []) store.ror[srcKey(r.name)] = (r.abilities || []).map(ab);
  for (const g of parsed.glossary || []) store.glossary[srcKey(g.name)] = g;
  return store;
}

const rtDb = () => new Promise((res, rej) => { try { const r = indexedDB.open('aos-rules-text', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch (e) { rej(e); } });

async function rtLoadStored() { try { const db = await rtDb(); return await new Promise(res => { const r = db.transaction('kv').objectStore('kv').get('rt'); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); } catch { return null; } }

// ================= Spielbegleiter (vierter Bereich) =================
// Laufendes Spiel in 'aos2-game', beendete Spiele in 'aos2-games'. Zwei Spieler (0 = ich, 1 = Gegner), 5 Runden,
// je Runde und Spieler: Punkte für Missionsziele, erfüllte Battle-Tactic-Stufen (je 5 SP), sonstige SP, Befehlspunkte.
const GM_TAC_VP = 5;
let game = store.get('aos2-game', null);
let games = store.get('aos2-games', []) || [];
const gmSave = () => { store.set('aos2-game', game); };
const gmSaveHist = () => { store.set('aos2-games', games); };
const gmEl = id => document.getElementById(id);
function gmRuleset() { return rulesetById(game && game.rs); }
function gmNew(keep) {
  const rs = rulesetById((keep && keep.rs) || (ws.bp && ws.bp.rs)), mine = listOfSide('mine', false), opp = listOfSide('opp', false);
  const pl = (l, i) => ({ name: (keep && keep.p[i].name) || (i ? L('Gegner', 'Opponent') : L('Ich', 'Me')), listId: l ? l.id : '', faction: l ? l.faction : '', tactics: l ? (l.tactics || []).filter(Boolean).slice(0, rs.maxTactics ?? 2) : [], fury: 0 });
  const rounds = [];
  for (let r = 0; r < 5; r++) rounds.push({ first: null, p: [0, 1].map(() => ({ obj: 0, tac: [], other: 0, cp: 4 })) });
  return { id: uid(), started: Date.now(), rs: rs.id, plan: (keep && keep.plan) || (ws.bp && ws.bp.plan) || '', att: 0, round: 0, p: [pl(mine, 0), pl(opp, 1)], rounds, open: { setup: true } };
}
if (!game || !game.rounds) game = gmNew();
const gmRoundVP = (r, i) => { const x = game.rounds[r].p[i]; return (+x.obj || 0) + x.tac.length * GM_TAC_VP + (+x.other || 0); };
const gmTotal = (i, upto = 5) => { let s = 0; for (let r = 0; r < upto; r++) s += gmRoundVP(r, i); return s; };
// Wie oft wurde eine Karte vor Runde r schon erfüllt → nächste Stufe
const gmDone = (i, card, upto) => { let n = 0; for (let r = 0; r < upto; r++) if (game.rounds[r].p[i].tac.includes(card)) n++; return n; };
function gmUnderdog(r) { const a = gmTotal(0, r), b = gmTotal(1, r); return a === b ? null : a < b ? 0 : 1; }
const gmPlan = () => { const ps = gmRuleset().battleplans || []; return ps.find(p => p.name === game.plan) || null; };
const gmName = i => game.p[i].name || (i ? L('Gegner', 'Opponent') : L('Ich', 'Me'));
const gmStep = (v, d, min = 0) => Math.max(min, (+v || 0) + d);

function gmResultText() {

function syncApply(c, docs) {

  else {
    const d = SY_COLL[c]; if (!d) return;
    const mc = SY.meta.coll[c] = SY.meta.coll[c] || {}, arr = d.get().slice();
    for (const r of docs) {
      const s = mc[r.id];

      const i = arr.findIndex(x => x && x.id === r.id), loc = i >= 0 ? arr[i] : null, lh = loc ? syHash(syJson(loc)) : '';

      }

      if (loc && lh === rh) { mc[r.id] = { h: rh, u: r.updated }; continue; }

async function syncLoadFirebase() {

  const app = A.initializeApp(SYNC_CFG), auth = Au.getAuth(app), db = F.getFirestore(app);
  try { await Au.getRedirectResult(auth); } catch {}
  return {
    onUser: cb => Au.onAuthStateChanged(auth, u => cb(u ? { uid: u.uid, email: u.email || '', name: u.displayName || '' } : null)),
    signIn: async () => {
      const p = new Au.GoogleAuthProvider(); p.setCustomParameters({ prompt: 'select_account' });

      catch (e) { if (e && /popup-blocked|operation-not-supported/.test(e.code || '')) await Au.signInWithRedirect(auth, p); else throw e; }
    },
    signOut: () => Au.signOut(auth),

    write: async (uid, ops) => {

}

        <li>${L('Datenstand exportieren und einen Namen vergeben.', 'Export the data version and give it a name.')} <button class="small primary" data-dm="export">${L('Datenstand exportieren', 'Export data version')}</button>${dirty ? ` <span class="hint">${L('(enthält deine noch nicht veröffentlichten Änderungen)', '(includes your unpublished changes)')}</span>` : ''}</li>
        <li>${L('Auf GitHub im Repository den Ordner „data“ öffnen → „Add file“ → „Upload files“ → Datei wählen → „Commit changes“. Nach 1–2 Minuten bekommen alle den neuen Stand.', 'On GitHub open the “data” folder in the repository → “Add file” → “Upload files” → pick the file → “Commit changes”. After 1–2 minutes everyone gets the new version.')}</li>
      </ol>
      <p class="hint">${L('Nur deine eigenen Kurzfassungen und Werte – die Original-Regeltexte (ZIP) sind nie im Datenstand enthalten.', 'Only your own summaries and stats – the original rules text (ZIP) is never part of a data version.')}</p>
    </div></details>`;
}
document.getElementById('dataPanel').addEventListener('click', e => {
  const b = e.target.closest('[data-dm]'); if (!b) return;
  const k = b.dataset.dm;
  if (k === 'reload') location.reload();
  else if (k === 'switch') { const v = document.getElementById('dmSel').value, cur = (() => { try { return localStorage.getItem('aos2-data-sel') || ''; } catch { return ''; } })(); if (v === cur && (v || !AD.newer)) { toast(L('Dieser Datenstand ist bereits aktiv.', 'This data version is already active.')); return; } dmSwitch(v); }
  else if (k === 'update') openDataUpdate();
  else if (k === 'export') dmExport();
});
let dmFiles = null;
function dmRefresh() { renderDataPanel(dmFiles); }
if (AD.mode === 'remote' && AD.list) AD.list(false).then(f => { dmFiles = f; dmRefresh(); }).catch(() => { dmFiles = []; dmRefresh(); });
window.addEventListener('aos-data-newer', () => { dmRefresh(); toast(L(`Neuer Datenstand „${AD.newer.name}“ – unten unter „Datenstand“ laden.`, `New data version “${AD.newer.name}” – load it under “Data version” below.`)); });
dmRefresh();

// ================= Start =================
renderToggles();
renderUnits();
renderLibrary();
renderLibTab();
addEnData(sharedView().units); addEnData(ws.units); addEnData(library);
renderShared();
renderTarget();
compute();
renderView();
renderRtPanel();
applyLang();
</script>
<script id="app-boot">// Startlader: holt den gewählten Datenstand (Einheiten, Fraktionen, Regeln) und startet dann die App.
// Eingebettete Daten (Offline-Datei, Claude-Seite) → sofort starten. Schlanke index.html (GitHub) → Datenstand aus data/*.json,
// zwischengespeichert in IndexedDB, Auswahl in localStorage 'aos2-data-sel' ('' = immer der neueste).
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var ls = { get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
  var D = window.AOS_DATA = { mode: 'embedded', cur: null, newer: null };
  function run() {
    var m = $('bootMsg'); if (m) m.remove();
    var s = document.createElement('script'); s.id = 'app-run'; s.textContent = $('app-script').textContent; document.body.appendChild(s);
  }
  var lib = $('shared-lib'), embedded = lib && lib.textContent.trim().length > 20;
  if (embedded) {
    try { var v = $('data-ver'); D.cur = v ? JSON.parse(v.textContent) : null; } catch (e) {}
    run(); return;
  }
  D.mode = 'remote';
  // ---------- IndexedDB ----------
  function idb() { return new Promise(function (res, rej) { var r = indexedDB.open('aos-data', 1); r.onupgradeneeded = function () { r.result.createObjectStore('files', { keyPath: 'file' }); }; r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
  function tx(mode, fn) { return idb().then(function (db) { return new Promise(function (res, rej) { var t = db.transaction('files', mode), st = t.objectStore('files'), out = fn(st); t.oncomplete = function () { res(out && out.result); }; t.onerror = function () { rej(t.error); }; }); }); }
  D.idbGet = function (file) { return file ? tx('readonly', function (st) { return st.get(file); }).catch(function () { return null; }) : Promise.resolve(null); };
  D.idbPut = function (rec) {
    return tx('readwrite', function (st) { st.put(rec); }).then(function () {
      var keep = [rec.file, ls.get('aos2-data-sel'), ls.get('aos2-data-latest'), D.cur && D.cur.file];
      return tx('readwrite', function (st) { var c = st.getAllKeys(); c.onsuccess = function () { c.result.forEach(function (k) { if (keep.indexOf(k) < 0) st.delete(k); }); }; });
    }).catch(function () {});
  };
  // ---------- Verfügbare Datenstände ----------
  D.list = function (force) {
    try { var c = JSON.parse(ls.get('aos2-data-list') || 'null'); if (!force && c && Date.now() - c.t < 600000 && c.files.length) return Promise.resolve(c.files); } catch (e) {}
    var gh = location.hostname.match(/^([^.]+)\.github\.io$/), repo = location.pathname.split('/')[1];
    var api = gh && repo ? fetch('https://api.github.com/repos/' + gh[1] + '/' + repo + '/contents/data', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw r.status; return r.json(); })
      .then(function (a) { return a.filter(function (x) { return x.type === 'file' && /\.json$/i.test(x.name) && x.name !== 'index.json'; }).map(function (x) { return x.name; }); }) : Promise.reject('no-gh');
    return api.catch(function () { return fetch('data/index.json', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw r.status; return r.json(); }); })
      .then(function (files) { files = files.slice().sort().reverse(); ls.set('aos2-data-list', JSON.stringify({ t: Date.now(), files: files })); return files; })
      .catch(function (e) { try { var c = JSON.parse(ls.get('aos2-data-list') || 'null'); if (c && c.files.length) return c.files; } catch (x) {} throw e; });
  };
  D.fetch = function (file) {
    return fetch('data/' + encodeURIComponent(file), { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { if (!d || d.kind !== 'data' || !d.shared) throw new Error('Keine Datenstand-Datei'); var rec = { file: file, name: d.name || file, created: d.created || '', shared: d.shared, rules: d.rules || null, saved: Date.now() }; return D.idbPut(rec).then(function () { return rec; }); });
  };
  D.label = function (file) { var m = String(file || '').replace(/\.json$/i, '').match(/^(\d{4}-\d{2}-\d{2})[_ -]?(.*)$/); return m ? m[1] + ' · ' + m[2].replace(/[-_]+/g, ' ') : String(file || '').replace(/\.json$/i, ''); };
  function apply(rec) {
    lib.textContent = JSON.stringify(rec.shared).replace(/</g, '\\u003c');
    $('rules-data').textContent = rec.rules ? JSON.stringify(rec.rules).replace(/</g, '\\u003c') : 'null';
    D.cur = { file: rec.file, name: rec.name, created: rec.created };
  }
  function msg(html) {
    var m = $('bootMsg'); if (!m) { m = document.createElement('div'); m.id = 'bootMsg'; m.style.cssText = 'max-width:520px;margin:18vh auto;padding:24px;text-align:center;font:16px/1.5 system-ui,sans-serif;color:var(--ink,#222)'; document.body.appendChild(m); }
    m.innerHTML = html;
  }
  // Ersten passenden Datenstand aus der Liste laden (bei Fehlern den nächsten probieren)
  function fetchFirst(files, i) { if (i >= files.length) return Promise.reject(new Error('Kein Datenstand ladbar')); return D.fetch(files[i]).catch(function () { return fetchFirst(files, i + 1); }); }
  var sel = ls.get('aos2-data-sel') || '', want = sel || ls.get('aos2-data-latest') || '';
  D.idbGet(want).then(function (rec) {
    if (rec) {
      apply(rec); run();
      // Im Hintergrund prüfen, ob es einen neueren Stand gibt (nur bei „immer der neueste“)
      if (!sel) D.list(true).then(function (files) {
        if (!files.length || files[0] === rec.file) return;
        return D.fetch(files[0]).then(function (n) { ls.set('aos2-data-latest', n.file); D.newer = { file: n.file, name: n.name }; window.dispatchEvent(new Event('aos-data-newer')); });
      }).catch(function () {});
      return;
    }
    msg('Lade Datenstand …');
    return D.list(true).then(function (files) {
      var order = sel && files.indexOf(sel) >= 0 ? [sel].concat(files.filter(function (f) { return f !== sel; })) : files;
      return fetchFirst(order, 0);
    }).then(function (n) {
      if (sel && n.file !== sel) ls.set('aos2-data-sel', '');
      if (!sel || n.file !== sel) ls.set('aos2-data-latest', n.file);
      apply(n); run();
    });
  }).catch(function (e) {
    msg('<b>Datenstand konnte nicht geladen werden.</b><br>Bitte Internetverbindung prüfen.<br><small style="opacity:.6">' + String((e && e.message) || e).replace(/</g, '&lt;') + '</small><br><br><button onclick="location.reload()" style="font:inherit;padding:6px 16px">Erneut versuchen</button>');
  });
})();
</script>
