// ================= Berechnung =================
function validate() {
  ws.units.forEach((u, ui) => {
    let ok = true;
    const uEl = unitsEl.querySelector(`.unit[data-u="${ui}"]`);
    u.weapons.forEach((w, wi) => {
      w._atk = parseDice(w.attacks); w._dmg = parseDice(w.dmg);
      const mOk = w.models >= 1 && w.models <= 60;
      const row = uEl && uEl.querySelector(`.weapon[data-w="${wi}"]`);
      if (row) {
        row.querySelector('[data-k=attacks]').classList.toggle('bad', !w._atk);
        row.querySelector('[data-k=dmg]').classList.toggle('bad', !w._dmg);
        row.querySelector('[data-k=models]').classList.toggle('bad', !mOk);
      }
      if (!w._atk || !w._dmg || !mOk) ok = false;
    });
    const dOk = u.def.models >= 1 && u.def.models <= 200 && u.def.health >= 1;
    if (uEl) uEl.querySelectorAll('[data-dk=models],[data-dk=health]').forEach(i => i.classList.toggle('bad', !(+i.value >= 1)));
    u._ok = ok && dOk;
    if (uEl) uEl.classList.toggle('invalid', !u._ok);
  });
}

// Einheiten mit gleichem Gruppennamen (z. B. ein Regiment) zusätzlich als Summe auswerten
function buildGroups(act) {
  const by = new Map();
  for (const u of act) { const g = String(u.group || '').trim(); if (g) { if (!by.has(g)) by.set(g, []); by.get(g).push(u); } }
  return [...by].filter(([, ms]) => ms.length > 1).map(([g, ms]) => ({
    id: 'grp:' + g, name: 'Σ ' + g, _group: ms, color: 'var(--ink)', reinforced: false, weapons: [],
    points: ms.every(m => effPoints(m) > 0) ? String(ms.reduce((t, m) => t + effPoints(m), 0)) : '' }));
}

// Faktor für die Normierung: null = keine Punkte hinterlegt
const factor = u => ws.norm ? (effPoints(u) > 0 ? 100 / effPoints(u) : null) : 1;

function compute() {
  validate();
  saveWs();
  const act = ws.units.filter(u => u.active && u._ok);
  const groups = buildGroups(act);
  if (ws.mode === 'off') renderOffense([...act, ...groups]); else renderDefense(act, groups);
}

// ================= Formatierung & Diagramme =================
const f1 = x => x == null || !isFinite(x) ? '–' : decSep(x.toFixed(x >= 100 ? 0 : x >= 10 ? 1 : 2));
const pct = x => decSep((x * 100).toFixed(1)) + ' %';
const W = 640, H = 300, M = { l: 48, r: 44, t: 18, b: 36 };
const iw = W - M.l - M.r, ih = H - M.t - M.b;
function niceMax(v) { if (!(v > 0)) return 1; const e = 10 ** Math.floor(Math.log10(v)); const n = v / e; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * e; }
function niceStep(v, int) { const e = 10 ** Math.floor(Math.log10(v)); const n = v / e; const s = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * e; return int ? Math.max(1, Math.round(s)) : s; }
const axisNum = v => +v.toFixed(2) + '';
function yGrid(max, fmt, side = 'l') {
  let s = ''; for (let i = 0; i <= 4; i++) {
    const v = max * i / 4, y = M.t + ih - ih * i / 4;
    if (side === 'l') s += `<line x1="${M.l}" x2="${W - M.r}" y1="${y}" y2="${y}" stroke="var(--grid)"/>`;
    s += `<text x="${side === 'l' ? M.l - 6 : W - M.r + 6}" y="${y + 4}" text-anchor="${side === 'l' ? 'end' : 'start'}">${fmt(v)}</text>`;
  } return s;
}
const svgWrap = (s, label) => `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}">${s}</svg>`;
const legendHtml = items => items.map(([c, n]) => `<span style="--c:${c}">${esc(n)}</span>`).join('');

function groupedBars(el, cats, series, fmt, label) {
  const vals = series.flatMap(s => s.values).filter(v => v != null && isFinite(v));
  const max = niceMax(Math.max(0, ...vals) * 1.12);
  const gw = iw / cats.length, n = Math.max(1, series.length), bw = Math.min(gw * .8 / n, 56), start = (gw - bw * n) / 2;
  let s = yGrid(max, axisNum);
  cats.forEach((c, ci) => {
    series.forEach((se, si) => {
      const v = se.values[ci]; if (v == null || !isFinite(v)) return;
      const x = M.l + ci * gw + start + si * bw, h = ih * v / max;
      s += `<rect x="${x + 1}" y="${M.t + ih - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2" fill="${se.color}"><title>${esc(se.name)} · ${c}: ${fmt(v)}</title></rect>`;
      if (n <= 2) s += `<text class="val" x="${x + bw / 2}" y="${M.t + ih - h - 5}" text-anchor="middle">${fmt(v)}</text>`;
    });
    s += `<text x="${M.l + ci * gw + gw / 2}" y="${H - 14}" text-anchor="middle">${c}</text>`;
  });
  el.innerHTML = svgWrap(s, label);
}

function lineChart(el, series, xmax, xLabel, onHover, label) {
  const xs = x => M.l + x / xmax * iw, ys = p => M.t + ih - ih * p;
  let s = yGrid(1, v => Math.round(v * 100) + '%');
  for (const se of series) s += `<polyline points="${se.pts.map(([x, p]) => `${xs(x).toFixed(1)},${ys(p).toFixed(1)}`).join(' ')}" fill="none" stroke="${se.color}" stroke-width="${se.width || 2}" stroke-linejoin="round"/>`;
  const step = niceStep(xmax / 8, !ws.norm);
  for (let v = 0; v <= xmax + 1e-9; v += step) s += `<text x="${xs(v)}" y="${H - 16}" text-anchor="middle">${axisNum(v)}</text>`;
  s += `<text x="${W - M.r}" y="${H - 2}" text-anchor="end">${xLabel}</text>`;
  s += `<line class="hl" x1="0" x2="0" y1="${M.t}" y2="${M.t + ih}" stroke="var(--muted)" visibility="hidden"/>`;
  s += `<rect x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML = svgWrap(s, label);
  attachHover(el, px => {
    const x = Math.max(0, Math.min(xmax, (px - M.l) / iw * xmax));
    const snapped = ws.norm ? Math.round(x * 10) / 10 : Math.round(x);
    const l = el.querySelector('.hl'); l.setAttribute('x1', xs(snapped)); l.setAttribute('x2', xs(snapped)); l.setAttribute('visibility', 'visible');
    onHover(snapped);
  }, () => { el.querySelector('.hl').setAttribute('visibility', 'hidden'); onHover(null); });
}

function attachHover(el, on, off) {
  const svg = el.querySelector('svg');
  svg.style.touchAction = 'pan-y';
  const move = e => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    if (p.x < M.l || p.x > W - M.r || p.y < M.t || p.y > M.t + ih) return off();
    on(p.x);
  };
  svg.addEventListener('pointermove', move);
  svg.addEventListener('pointerdown', move);
  svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') off(); });
}

function xMax99(d) { let acc = 0, i = 0; for (; i < d.length; i++) { acc += d[i]; if (acc > .999) break; } return Math.max(1, i); }
// P(mindestens x) für eine skalierte Verteilung
const atLeastScaled = (r, k, x) => r.atLeast[Math.max(0, Math.ceil(x / k - 1e-9))] || 0;

// ================= Offensive =================
function renderOffense(act) {
  const health = Math.max(1, parseInt(ws.target.health) || 1);
  const norm = ws.norm, unitLbl = norm ? 'Schaden / 100 Pkt.' : 'Schaden';
  const tu = ws.target.unit, tM = targetUnitModels(), tPts = tu && +tu.points ? +tu.points * (ws.target.reinf ? 2 : 1) : 0;
  const R = act.map(u => {
    const res = SAVES.map(s => {
      const r = unitDist(u, offCtx(s));
      let kills = 0, wipe = 0;
      r.dist.forEach((p, i) => { kills += p * (tM ? Math.min(tM, Math.floor(i / health)) : Math.floor(i / health)); if (tM && i >= tM * health) wipe += p; });
      return { save: s, ...r, kills, wipe };
    });
    return { u, k: factor(u), color: colorOf(u), res };
  });
  const shown = R.filter(r => r.k != null);
  const missing = R.filter(r => r.k == null).map(r => r.u.name);
  document.getElementById('offNote').textContent = missing.length ? `Ohne Punktkosten nicht normierbar: ${missing.join(', ')}` : '';

  const selIdx = SAVES.indexOf(ws.selSave);
  document.querySelectorAll('.saveSeg').forEach(seg => seg.innerHTML = SAVES.map(s => `<button data-s="${s}" class="${s === ws.selSave ? 'on' : ''}">${saveLabel(s)}</button>`).join(''));

  // Tabelle: Ø Schaden je Save
  document.getElementById('offTableTitle').textContent = norm ? 'Ø Schaden pro 100 Punkte je Rüstungswurf' : 'Ø Schaden je Rüstungswurf';
  const best = SAVES.map((_, si) => Math.max(...shown.map(r => r.res[si].mean * r.k)));
  document.getElementById('offTable').innerHTML = `<thead><tr><th>Einheit</th>${SAVES.map(s => `<th>Save ${saveLabel(s)}${tu && s === tu.save ? ' (Ziel)' : ''}</th>`).join('')}</tr></thead><tbody>` +
    (R.length ? R.map(r => `<tr><td><span class="sw" style="--uc:${r.color}"></span>${esc(r.u.name)}</td>${r.res.map((x, si) => {
      const v = r.k == null ? null : x.mean * r.k;
      return `<td class="${shown.length > 1 && v != null && Math.abs(v - best[si]) < 1e-9 ? 'best' : ''}">${f1(v)}</td>`;
    }).join('')}</tr>`).join('') : `<tr><td colspan="7" class="hint">Keine aktive Einheit.</td></tr>`) + '</tbody>';

  // Balkendiagramm
  document.getElementById('avgTitle').textContent = norm ? 'Ø Schaden pro 100 Punkte' : 'Durchschnittlicher Schaden';
  if (shown.length === 1 && shown[0].res[0].names.length > 1) {
    // Eine Einheit mit mehreren Schadensquellen: nach Waffen aufschlüsseln
    const r = shown[0], names = r.res[0].names;
    groupedBars(document.getElementById('avgChart'), SAVES.map(saveLabel),
      names.map((n, j) => ({ name: n, color: PALETTE[(j + 1) % PALETTE.length], values: r.res.map(x => x.parts[j] * r.k) })), f1, 'Schaden je Waffe');
    document.getElementById('avgLegend').innerHTML = legendHtml(names.map((n, j) => [PALETTE[(j + 1) % PALETTE.length], n]));
  } else {
    groupedBars(document.getElementById('avgChart'), SAVES.map(saveLabel),
      shown.map(r => ({ name: r.u.name, color: r.color, values: r.res.map(x => x.mean * r.k) })), f1, 'Ø Schaden je Rüstungswurf');
    document.getElementById('avgLegend').innerHTML = legendHtml(shown.map(r => [r.color, r.u.name]));
  }

  // Kurven: mindestens X
  const cumEl = document.getElementById('cumChart'), ro = document.getElementById('cumReadout');
  const xLbl = norm ? 'Schaden / 100 Pkt.' : 'Schaden';
  let series, readFn;
  if (shown.length === 1) {
    const r = shown[0];
    document.getElementById('cumTitle').textContent = 'Mindestens X Schaden: alle Saves';
    const ramp = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
    series = r.res.map((x, si) => ({ color: ramp[si], width: x.save === ws.selSave ? 3.5 : 2, pts: x.atLeast.slice(0, -1).map((p, i) => [i * r.k, p]), name: 'Save ' + saveLabel(x.save), x }));
    document.getElementById('cumLegend').innerHTML = legendHtml(series.map(s => [s.color, s.name]));
    readFn = x => `Mindestens <b>${f1(x)}</b> ${xLbl}: ` + series.map(s => `${saveLabel(s.x.save)} <b>${pct(atLeastScaled(s.x, r.k, x))}</b>`).join(' · ');
  } else {
    document.getElementById('cumTitle').textContent = `Mindestens X Schaden gegen ${saveLabel(ws.selSave)}`;
    series = shown.map(r => ({ color: r.color, width: 2.5, pts: r.res[selIdx].atLeast.slice(0, -1).map((p, i) => [i * r.k, p]), name: r.u.name, r }));
    document.getElementById('cumLegend').innerHTML = legendHtml(series.map(s => [s.color, s.name]));
    readFn = x => `Mindestens <b>${f1(x)}</b> ${xLbl}: ` + series.map(s => `${esc(s.name)} <b>${pct(atLeastScaled(s.r.res[selIdx], s.r.k, x))}</b>`).join(' · ');
  }
  const xmax = Math.max(1e-9, ...(shown.length === 1 ? shown[0].res.map(x => xMax99(x.dist) * shown[0].k) : shown.map(r => xMax99(r.res[selIdx].dist) * r.k)));
  const defRead = 'Mit der Maus über das Diagramm fahren oder antippen, um die Werte abzulesen.';
  ro.innerHTML = defRead;
  if (series.length) lineChart(cumEl, series, xmax, xLbl, x => ro.innerHTML = x == null ? defRead : readFn(x), 'Wahrscheinlichkeit für mindestens X Schaden');
  else cumEl.innerHTML = '';

  // Detailtabelle für gewählten Save
  const tIn = parseInt(ws.target.thresh);
  const thresh = tIn > 0 ? tIn : Math.max(1, Math.round(R.length ? R[0].res[2].mean : 1));
  document.getElementById('tThresh').placeholder = 'auto (' + thresh + ')';
  document.getElementById('selTitle').textContent = tu && ws.selSave === tu.save ? `Details gegen ${tu.name} (Save ${saveLabel(ws.selSave)})` : `Details gegen Save ${saveLabel(ws.selSave)}`;
  const nk = norm ? ' / 100 Pkt.' : '';
  document.getElementById('selTable').innerHTML = `<thead><tr><th>Einheit</th><th>Ø Schaden${nk}</th><th>± Std.-Abw.${nk}</th><th>Median${nk}</th><th>P(≥ ${thresh} Schaden)</th><th>P(0 Schaden)</th><th>Ø getötete Modelle (${health} LP${tM ? ', max. ' + tM : ''})${nk}</th>${tM ? '<th>P(Ziel ausgelöscht)</th>' : ''}${tPts ? `<th>Ø vernichtete Punkte${nk}</th>` : ''}</tr></thead><tbody>` +
    R.map(r => { const x = r.res[selIdx], k = r.k; return `<tr><td><span class="sw" style="--uc:${r.color}"></span>${esc(r.u.name)}</td><td><b>${f1(k && x.mean * k)}</b></td><td>${f1(k && x.sd * k)}</td><td>${f1(k && x.median * k)}</td><td>${pct(x.atLeast[thresh] || 0)}</td><td>${pct(x.dist[0])}</td><td>${f1(k && x.kills * k)}</td>${tM ? `<td><b>${pct(x.wipe)}</b></td>` : ''}${tPts ? `<td>${f1(k && x.kills * tPts / tM * k)}</td>` : ''}</tr>`; }).join('') + '</tbody>';

  // Verteilung einer Einheit
  const sel = document.getElementById('detailUnit');
  sel.innerHTML = R.map(r => `<option value="${r.u.id}">${esc(r.u.name)}</option>`).join('');
  const D = R.find(r => r.u.id === ws.detail) || R[0];
  if (D) sel.value = D.u.id;
  renderDetail(D, selIdx);
}

function renderDetail(D, selIdx) {
  const el = document.getElementById('distChart'), ro = document.getElementById('distReadout');
  if (!D) { el.innerHTML = ''; ro.innerHTML = ''; return; }
  const r = D.res[selIdx], k = D.k ?? 1, xl = D.k != null && ws.norm ? ' / 100 Pkt.' : '';
  const xmax = xMax99(r.dist);
  const ymax = niceMax(Math.max(...r.dist.slice(0, xmax + 1)) * 1.08);
  const bw = iw / (xmax + 1), xs = v => M.l + (v + .5) * bw;
  let s = yGrid(ymax, v => Math.round(v * 100) + '%') + yGrid(1, v => Math.round(v * 100) + '%', 'r');
  for (let i = 0; i <= xmax; i++) {
    const h = ih * (r.dist[i] || 0) / ymax;
    s += `<rect x="${M.l + i * bw + bw * .1}" y="${M.t + ih - h}" width="${bw * .8}" height="${h}" rx="2" fill="var(--bar)"/>`;
  }
  s += `<polyline points="${Array.from({ length: xmax + 1 }, (_, i) => `${xs(i)},${M.t + ih - ih * (r.atLeast[i] || 0)}`).join(' ')}" fill="none" stroke="var(--curve)" stroke-width="2.5" stroke-linejoin="round"/>`;
  s += `<line x1="${xs(r.mean)}" x2="${xs(r.mean)}" y1="${M.t}" y2="${M.t + ih}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".6"/>`;
  s += `<text x="${xs(r.mean) + 4}" y="${M.t + 10}" class="val" style="font-size:11px">Ø ${f1(r.mean * k)}</text>`;
  const step = Math.max(1, Math.ceil(xmax / 12));
  for (let v = 0; v <= xmax; v += step) s += `<text x="${xs(v)}" y="${H - 16}" text-anchor="middle">${f1(v * k)}</text>`;
  s += `<text x="${W - M.r}" y="${H - 2}" text-anchor="end">Schaden${xl}</text>`;
  s += `<line class="hl" x1="0" x2="0" y1="${M.t}" y2="${M.t + ih}" stroke="var(--muted)" visibility="hidden"/>`;
  s += `<rect x="${M.l}" y="${M.t}" width="${iw}" height="${ih}" fill="transparent"/>`;
  el.innerHTML = svgWrap(s, 'Schadensverteilung');
  let p80 = 0; while ((r.atLeast[p80 + 1] || 0) >= .8) p80++;
  const def = `<b>${esc(D.u.name)}</b> gegen <b>${saveLabel(r.save)}</b>: Ø <b>${f1(r.mean)}</b> Schaden, in 80 % der Fälle mindestens <b>${p80}</b>.`;
  ro.innerHTML = def;
  attachHover(el, px => {
    const i = Math.floor((px - M.l) / bw); if (i < 0 || i > xmax) return;
    const l = el.querySelector('.hl'); l.setAttribute('x1', xs(i)); l.setAttribute('x2', xs(i)); l.setAttribute('visibility', 'visible');
    ro.innerHTML = `Genau <b>${i}</b> Schaden: <b>${pct(r.dist[i] || 0)}</b> · mindestens ${i}: <b>${pct(r.atLeast[i] || 0)}</b>`;
  }, () => { el.querySelector('.hl').setAttribute('visibility', 'hidden'); ro.innerHTML = def; });
}

// ================= Defensive =================
const RENDS = [0, 1, 2, 3];
function ehp(u, rend) { // rend = 'mortal' oder Zahl
  const hp = effModels(u) * u.def.health;
  const pu = rend === 'mortal' ? 1 : failSave(+u.def.save, rend - ((u.dmods || {}).save ? 1 : 0));
  return hp / (pu * (1 - wardQ(+u.def.ward)));
}

function renderDefense(act, groups = []) {
  const norm = ws.norm;
  const R = [...act, ...groups].map(u => ({ u, k: factor(u), color: colorOf(u), vals: [...RENDS, 'mortal'].map(r => u._group ? u._group.reduce((t, m) => t + ehp(m, r), 0) : ehp(u, r)) }));
  const shown = R.filter(r => r.k != null);
  const missing = R.filter(r => r.k == null).map(r => r.u.name);
  document.getElementById('defNote').textContent = missing.length ? `Ohne Punktkosten nicht normierbar: ${missing.join(', ')}` : '';
  const cats = ['Rend –', 'Rend −1', 'Rend −2', 'Rend −3', 'Mortal'];

  document.getElementById('ehpTitle').textContent = norm ? 'Effektive Lebenspunkte pro 100 Punkte' : 'Effektive Lebenspunkte';
  const best = cats.map((_, ci) => Math.max(...shown.map(r => r.vals[ci] * r.k)));
  document.getElementById('ehpTable').innerHTML = `<thead><tr><th>Einheit</th><th>LP gesamt</th><th>Save</th><th>Ward</th>${cats.map(c => `<th>${c}</th>`).join('')}</tr></thead><tbody>` +
    (R.length ? R.map(r => `<tr><td><span class="sw" style="--uc:${r.color}"></span>${esc(r.u.name)}</td><td>${r.u._group ? r.u._group.reduce((t, m) => t + effModels(m) * m.def.health, 0) : effModels(r.u) * r.u.def.health}</td><td>${r.u._group ? '–' : saveLabel(+r.u.def.save)}</td><td>${!r.u._group && +r.u.def.ward ? r.u.def.ward + '+' : '–'}</td>${r.vals.map((v, ci) => {
      const x = r.k == null ? null : v * r.k;
      return `<td class="${shown.length > 1 && x != null && Math.abs(x - best[ci]) < 1e-9 ? 'best' : ''}">${f1(x)}</td>`;
    }).join('')}</tr>`).join('') : `<tr><td colspan="9" class="hint">Keine aktive Einheit.</td></tr>`) + '</tbody>';

  document.getElementById('ehpChartTitle').textContent = norm ? 'Effektive Lebenspunkte pro 100 Punkte je Rend' : 'Effektive Lebenspunkte je Rend';
  groupedBars(document.getElementById('ehpChart'), cats, shown.map(r => ({ name: r.u.name, color: r.color, values: r.vals.map(v => v * r.k) })), f1, 'Effektive Lebenspunkte je Rend');
  document.getElementById('ehpLegend').innerHTML = legendHtml(shown.map(r => [r.color, r.u.name]));

  // Matchup-Matrix
  const attackers = [...act.filter(u => u.weapons.length), ...groups];
  document.getElementById('mxTitle').textContent = 'Matchups: Angreifer (Zeilen) gegen Verteidiger (Spalten)';
  document.getElementById('mxHint').textContent = (norm ? 'Große Zahl: vernichtete gegnerische Punkte pro 100 eigene Punkte.' : 'Große Zahl: Ø getötete Modelle.') + ' Schlüsselwörter und defensive Modifikatoren der Verteidiger werden berücksichtigt' + (ws.charged ? ', die Angreifer haben angegriffen.' : '.');
  const defs = mxDefenders(act);
  const cells = attackers.map(a => defs.map(d => {
    const { dist } = unitDist(a, defCtx(d));
    const dm = effModels(d), hp = dm * d.def.health;
    let kills = 0, dmg = 0, wipe = 0;
    dist.forEach((p, i) => { kills += p * Math.min(dm, Math.floor(i / d.def.health)); dmg += p * Math.min(i, hp); if (i >= hp) wipe += p; });
    const ptsVal = effPoints(a) > 0 && effPoints(d) > 0 ? kills * (effPoints(d) / dm) * 100 / effPoints(a) : null;
    return { kills, dmg, wipe, main: norm ? ptsVal : kills };
  }));
  const mmax = Math.max(1e-9, ...cells.flat().map(c => c.main ?? 0));
  const tbl = document.getElementById('matrix');
  if (!attackers.length || !defs.length) { tbl.innerHTML = '<tr><td class="hint">Keine aktiven Einheiten mit Waffen.</td></tr>'; return; }
  tbl.innerHTML = `<thead><tr><th>Angreifer ↓ / Verteidiger →</th>${defs.map(d => `<th><span class="sw" style="--uc:${colorOf(d)};display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--uc);margin-right:6px"></span>${esc(d.name)}</th>`).join('')}</tr></thead><tbody>` +
    attackers.map((a, ai) => `<tr><td><span class="sw" style="--uc:${colorOf(a)}"></span>${esc(a.name)}</td>${cells[ai].map(c => `
      <td style="background:color-mix(in srgb, var(--accent) ${c.main == null ? 0 : Math.round(c.main / mmax * 38)}%, transparent)">
        <div class="big">${c.main == null ? '–' : f1(c.main)}</div>
        <div class="sub">${f1(c.dmg)} Schaden · ${pct(c.wipe)} ausgelöscht</div>
      </td>`).join('')}</tr>`).join('') + '</tbody>';
}

// ================= Gemeinsame Bibliothek =================
// Die gemeinsame Bibliothek steht als JSON in der Seite. Wer die Seite bearbeiten darf,
// sammelt Änderungen als Entwurf und veröffentlicht dann eine neue Version der Seite.
const ALLIANCES = ['Order', 'Chaos', 'Death', 'Destruction'];
const shared = (() => { try { const d = JSON.parse(document.getElementById('shared-lib').textContent); return { factions: d.factions || [], units: d.units || [], version: d.version || 1 }; } catch { return { factions: [], units: [], version: 1 }; } })();
const hashStr = str => { let h = 5381; for (let i = 0; i < str.length; i++) h = (Math.imul(h, 33) ^ str.charCodeAt(i)) >>> 0; return h.toString(36); };
const sharedBase = hashStr(JSON.stringify(shared) + ((document.getElementById('rules-data') || {}).textContent || ''));
let draft = store.get('aos2-shared-draft', null);
if (draft && (draft.base !== sharedBase || (!draft.rules && JSON.stringify(draft.data) === JSON.stringify(shared)))) { draft = null; store.set('aos2-shared-draft', null); }
const sharedView = () => draft ? draft.data : shared;
let sharedWriter = false, artifactApi = null, sharedQuery = '';
const byName = (a, b) => a.name.localeCompare(b.name, 'en');

function factionOptions(sel) {
  const facs = sharedView().factions;
  let html = `<option value="">– keine –</option>`;
  for (const al of ALLIANCES) {
    const fs = facs.filter(f => f.alliance === al).sort(byName);
    if (fs.length) html += `<optgroup label="${al}">${fs.map(f => `<option value="${esc(f.name)}"${f.name === sel ? ' selected' : ''}>${esc(f.name)}</option>`).join('')}</optgroup>`;
  }
  if (sel && !facs.some(f => f.name === sel)) html += `<option value="${esc(sel)}" selected>${esc(sel)}</option>`;
  return html;
}

function editShared(fn) {
  const data = clone(sharedView());
  fn(data);
  data.units.sort(byName);
  draft = { base: sharedBase, data };
  store.set('aos2-shared-draft', draft);
  renderShared();
}

const UNIT_GROUPS = ['Helden', 'Monster', 'Kavallerie', 'Infanterie', 'Kriegsmaschinen', 'Bestien & Sonstige', 'Scourge-Kampagne', 'Legends'];
function unitGroup(u) {
  const k = new Set((u.keywords || []).map(x => String(x).toLowerCase()));
  if (/^scourge of/i.test(u.name)) return 'Scourge-Kampagne';
  if (u.legends) return 'Legends';
  if (k.has('hero')) return 'Helden';
  if (k.has('monster')) return 'Monster';
  if (k.has('cavalry')) return 'Kavallerie';
  if (k.has('infantry')) return 'Infanterie';
  if (k.has('war machine')) return 'Kriegsmaschinen';
  return 'Bestien & Sonstige';
}
function renderShared() {
  const data = sharedView(), q = sharedQuery.trim().toLowerCase();
  const el = document.getElementById('sharedLib');
  const open = new Set([...el.querySelectorAll('details[open]')].map(d => d.dataset.key));
  let html = '';
  for (const al of ALLIANCES) {
    let total = 0;
    const blocks = data.factions.filter(f => f.alliance === al).sort(byName).map(f => {
      const matchFac = !q || f.name.toLowerCase().includes(q) || al.toLowerCase().includes(q);
      const us = data.units.map((u, i) => ({ u, i })).filter(x => x.u.faction === f.name && (matchFac || x.u.name.toLowerCase().includes(q))).sort((a, b) => byName(a.u, b.u));
      if (q && !us.length && !matchFac) return '';
      total += us.length;
      const key = 'f:' + f.name;
      const item = ({ u, i }) => `
          <div class="lib-item">
            <div class="meta"><b title="${esc(u.name)}">${esc(u.name)}</b><span>${esc(unitSummary(u))}${u.unverified ? ' · <em class="tag" title="Werte aus dem Gedächtnis, bitte mit der Warscroll abgleichen">ungeprüft</em>' : ''}${u.note ? `<span class="note">${esc(u.note)}</span>` : ''}</span></div>
            <button class="small" data-sh="load" data-i="${i}" title="Zum Vergleich hinzufügen">Laden</button>
            ${sharedWriter ? `<button class="icon" data-sh="del" data-i="${i}" title="Aus der gemeinsamen Bibliothek löschen">✕</button>` : ''}
          </div>`;
      // Bei vielen Einheiten nach Typ gruppieren, damit die Liste kurz bleibt; bei einer Suche flach anzeigen.
      let inner;
      if (!q && us.length > 8) {
        const groups = new Map(UNIT_GROUPS.map(g => [g, []]));
        for (const x of us) groups.get(unitGroup(x.u)).push(x);
        inner = [...groups].filter(([, xs]) => xs.length).map(([g, xs]) => {
          const gk = 'g:' + f.name + ':' + g;
          return `<details class="grp" data-key="${esc(gk)}"${open.has(gk) ? ' open' : ''}><summary><span>${esc(g)}</span><span class="count">${xs.length}</span></summary>${xs.map(item).join('')}</details>`;
        }).join('');
      } else inner = us.map(item).join('');
      return `<details class="fac" data-key="${esc(key)}"${q || open.has(key) ? ' open' : ''}>
        <summary><span>${esc(f.name)}</span><span class="count">${us.length}</span></summary>
        ${inner || '<div class="hint empty">Noch keine Einheiten.</div>'}
        ${sharedWriter ? `<button class="linkish" data-sh="delfac" data-f="${esc(f.name)}">Fraktion entfernen</button>` : ''}
      </details>`;
    }).join('');
    if (q && !blocks) continue;
    const key = 'a:' + al;
    html += `<details class="ga ga-${al}" data-key="${key}"${q || open.has(key) ? ' open' : ''}><summary>${al}<span class="count">${total}</span></summary>${blocks}</details>`;
  }
  el.innerHTML = html || '<div class="hint">Nichts gefunden.</div>';

  const tools = document.getElementById('sharedTools');
  if (sharedWriter) {
    tools.innerHTML = `
      <div class="lib-actions">
        <button class="small" data-sh="addfac">+ Fraktion</button>
        <button class="small" data-sh="import">Einheiten aus Text</button>
        <button class="small" data-sh="aoi">Daten aktualisieren</button>
      </div>
      <div class="hint" style="margin-top:8px">Du kannst die gemeinsame Bibliothek bearbeiten. Eigene Einheiten fügst du über „Teilen“ an der Einheit hinzu (vorher eine Fraktion wählen).</div>
      ${draft ? `<div class="pending"><span>Änderungen noch nicht veröffentlicht. Erst danach sehen andere sie.</span><button class="small primary" data-sh="publish">Veröffentlichen</button><button class="small" data-sh="discard">Verwerfen</button></div>` : ''}`;
  } else {
    tools.innerHTML = `<div class="hint" style="margin-top:10px">Diese Bibliothek pflegt der Besitzer der Seite. Einheit vorschlagen: unter „Meine“ speichern, über „Sichern / Übertragen“ den Text kopieren und an ihn schicken. Mit <span class="tag">ungeprüft</span> markierte Werte stammen aus dem Gedächtnis und sollten mit der Warscroll abgeglichen werden.</div>`;
  }
}

function renderLibTab() {
  const tab = ws.libTab === 'mine' ? 'mine' : 'shared';
  document.querySelectorAll('#libSeg button').forEach(b => b.classList.toggle('on', b.dataset.libtab === tab));
  document.getElementById('sharedPane').hidden = tab !== 'shared';
  document.getElementById('minePane').hidden = tab !== 'mine';
}
document.getElementById('libSeg').onclick = e => { const t = e.target.dataset.libtab; if (t) { ws.libTab = t; saveWs(); renderLibTab(); } };
document.getElementById('sharedSearch').addEventListener('input', e => { sharedQuery = e.target.value; renderShared(); });
document.getElementById('collapseAll').onclick = () => {
  const q = document.getElementById('sharedSearch');
  if (q.value) { q.value = ''; sharedQuery = ''; renderShared(); }
  document.querySelectorAll('#sharedLib details[open]').forEach(d => d.open = false);
};
// Immer nur eine Fraktion offen, damit die Liste nicht endlos wird (nicht während einer Suche).
document.getElementById('sharedLib').addEventListener('toggle', e => {
  const d = e.target;
  if (sharedQuery.trim() || !d.open || !d.matches('details.fac')) return;
  document.querySelectorAll('#sharedLib details.fac[open]').forEach(o => { if (o !== d) o.open = false; });
  requestAnimationFrame(() => { const r = d.getBoundingClientRect(); if (r.top < 0) d.scrollIntoView({ block: 'start' }); });
}, true);

function loadUnit(src) {
  const u = clone(src); u.id = uid(); u.open = false; u.active = true;
  delete u.savedAt; delete u.unverified;
  ws.units.push(u); renderUnits(); compute(); toast(`„${src.name}“ zum Vergleich hinzugefügt`);
}

async function shareUnit(u) {
  const data = sharedView();
  if (!u.faction || !data.factions.some(f => f.name === u.faction)) { u.open = true; renderUnits(); toast('Bitte zuerst unter „Fraktion & Defensive“ eine Fraktion wählen.'); return; }
  const name = u.name.trim() || 'Ohne Namen';
  const idx = data.units.findIndex(x => x.name === name && x.faction === u.faction);
  if (idx >= 0 && !(await askConfirm(`„${name}“ (${u.faction}) gibt es schon in der gemeinsamen Bibliothek. Ersetzen?`, 'Ersetzen'))) return;
  editShared(d => {
    const entry = { ...clone(u), name, open: false, active: true };
    delete entry.id; delete entry.color; delete entry.unverified;
    const i = d.units.findIndex(x => x.name === name && x.faction === u.faction);
    if (i >= 0) d.units[i] = entry; else d.units.push(entry);
  });
  ws.libTab = 'shared'; saveWs(); renderLibTab();
  toast(`„${name}“ vorgemerkt. Zum Abschluss „Veröffentlichen“ klicken.`);
}

function buildPage(data, rules) {
  const json = JSON.stringify(data).replace(/</g, '\\u003c'), rjson = JSON.stringify(rules || rulesView()).replace(/</g, '\\u003c');
  return '<!doctype html>\n<html lang="de">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>AoS Einheitenrechner</title>\n'
    + '<style id="app-style">' + PAGE_STYLE + '</style>\n</head>\n<body>\n'
    + '<template id="app-shell">' + PAGE_SHELL + '</template>\n'
    + '<script type="application/json" id="shared-lib">' + json + '<\/script>\n'
    + '<script type="application/json" id="rules-data">' + rjson + '<\/script>\n'
    + '<script id="app-script" type="text/x-app">' + PAGE_SCRIPT + '<\/script>\n<script id="app-boot">' + PAGE_BOOT + '<\/script>\n</body>\n</html>\n';
}

async function publishShared(btn) {
  if (!draft || !artifactApi) return;
  btn.disabled = true; btn.textContent = 'Wird veröffentlicht …';
  try {
    await artifactApi.publish(buildPage(draft.data, draft.rules || RULES));
    toast('Veröffentlicht. Die Seite lädt neu.');
  } catch (e) {
    const code = e && e.code;
    if (code === 'conflict') toast('Es gab gerade eine neuere Version. Die Seite lädt neu.');
    else if (['not_writer', 'not_granted', 'consent_required', 'capability_disabled', 'capability_removed', 'not_declared'].includes(code)) {
      sharedWriter = false; renderShared(); renderUnits(); toast('Hier ist nur Lesen möglich. Bearbeiten kann nur der Besitzer der Seite.');
    } else if (code === 'rate_limited') toast('Zu viele Veröffentlichungen. Bitte kurz warten und erneut versuchen.');
    else if (code === 'too_large') toast('Die Bibliothek ist zu groß zum Veröffentlichen.');
    else toast('Veröffentlichen fehlgeschlagen. Bitte gleich noch einmal versuchen.');
    btn.disabled = false; btn.textContent = 'Veröffentlichen';
  }
}

function openAddFaction() {
  openModal('Fraktion hinzufügen', `
    <label>Name (englisch)<input id="facName" placeholder="z. B. Beasts of Chaos"></label>
    <label>Grand Alliance<select id="facAlliance">${ALLIANCES.map(a => `<option>${a}</option>`).join('')}</select></label>`,
    [{ label: 'Abbrechen', cancel: true }, { label: 'Hinzufügen', primary: true, onClick: () => {
      const name = document.getElementById('facName').value.trim(), alliance = document.getElementById('facAlliance').value;
      if (!name) { toast('Bitte einen Namen eingeben.'); return false; }
      if (sharedView().factions.some(f => f.name.toLowerCase() === name.toLowerCase())) { toast('Diese Fraktion gibt es schon.'); return false; }
      editShared(d => d.factions.push({ name, alliance }));
      toast(`„${name}“ vorgemerkt. Zum Abschluss „Veröffentlichen“ klicken.`);
    } }]);
  document.getElementById('facName').focus();
}

function openSharedImport() {
  openModal('Einheiten aus Text übernehmen', `
    <p class="hint">Füge hier den Text ein, den jemand über „Sichern / Übertragen“ kopiert hat. Einheiten mit gleichem Namen in derselben Fraktion werden ersetzt.</p>
    <textarea id="shImport" rows="8" spellcheck="false" aria-label="Einheiten als Text"></textarea>
    <label>Fraktion für Einheiten ohne Fraktion<select id="shFaction">${factionOptions('')}</select></label>`,
    [{ label: 'Abbrechen', cancel: true }, { label: 'Übernehmen', primary: true, onClick: () => {
      let list;
      try { const d = JSON.parse(document.getElementById('shImport').value); list = Array.isArray(d) ? d : d.library || d.units; if (!Array.isArray(list)) throw 0; }
      catch { toast('Text nicht erkannt. Bitte den kompletten Text einfügen.'); return false; }
      const fallback = document.getElementById('shFaction').value, facs = sharedView().factions;
      let n = 0, skipped = 0;
      editShared(d => {
        for (const l of list) {
          if (!l || !l.name || !Array.isArray(l.weapons) || !l.def) { skipped++; continue; }
          const faction = facs.some(f => f.name === l.faction) ? l.faction : fallback;
          if (!faction) { skipped++; continue; }
          const entry = { ...clone(l), faction, open: false, active: true };
          delete entry.id; delete entry.color; delete entry.savedAt; delete entry.unverified;
          const i = d.units.findIndex(x => x.name === entry.name && x.faction === faction);
          if (i >= 0) d.units[i] = entry; else d.units.push(entry);
          n++;
        }
      });
      toast(`${n} Einheit${n === 1 ? '' : 'en'} vorgemerkt${skipped ? `, ${skipped} ohne Fraktion übersprungen` : ''}. Zum Abschluss „Veröffentlichen“ klicken.`);
    } }]);
}

// ================= Datenschicht: Quellen & Regeln =================
// Alle Spieldaten liegen in einem eigenen, quellenunabhängigen Format:
//  • Einheiten in der gemeinsamen Bibliothek (shared-lib), ergänzt um regimentOptions, joinAs, uniqueOnly usw.
//  • Fraktionsregeln (Battle Traits, Formationen, Enhancements, Lehren, Terrain, Regiments of Renown) in rules-data.
// Eine Datenquelle ist nur ein Adapter, der eine Datei in dieses Format übersetzt (DataSources.register).
// Neue Quelle = neuer Adapter; Builder und Rechner bleiben unverändert.
const RULES_EMPTY = { schema: 1, rulesets: [], factions: {}, regimentsOfRenown: [] };
const RULES = (() => { try { const d = JSON.parse(document.getElementById('rules-data').textContent); return { ...RULES_EMPTY, ...d }; } catch { return clone(RULES_EMPTY); } })();
const rulesView = () => (draft && draft.rules) || RULES;
function editRules(fn) {
  const data = clone(sharedView()), rules = clone(rulesView());
  fn(rules, data);
  data.units.sort(byName);
  draft = { base: sharedBase, data, rules };
  store.set('aos2-shared-draft', draft);
  renderShared(); if (typeof renderBuilder === 'function') renderBuilder();
}
const factionRules = f => rulesView().factions[f] || null;
const rulesetById = id => rulesView().rulesets.find(r => r.id === id) || rulesView().rulesets[0] || DEFAULT_RULESET;
const DEFAULT_RULESET = { id: 'core', name: 'Core Rules', season: '', pointsOptions: [1000, 2000], defaultPoints: 2000, maxRegiments: 5, regimentUnits: 3, generalRegimentUnits: 4,
  maxRegimentsOfRenown: 1, maxFactionTerrain: 1, maxReinforced: null, requireFormation: true, legendsAllowed: false };

// ---------- Registrierung der Datenquellen ----------
const DataSources = {
  list: [],
  register(src) { this.list = this.list.filter(s => s.id !== src.id); this.list.push(src); },
  get(id) { return this.list.find(s => s.id === id) || null; },
  detect(text) { return this.list.find(s => { try { return s.detect(text); } catch { return false; } }) || null; }
};
// Vertrag eines Adapters:
//   id, label, hint (Anleitung, HTML), accept (Dateitypen)
//   detect(text) → true, wenn die Datei zu dieser Quelle passt
//   parse(text)  → { meta: { dataVersion }, units: [NormUnit], factions: { [Fraktion]: FactionRules }, regimentsOfRenown: [RoR] }
// NormUnit     = internes Einheitenformat (wie in der Bibliothek) + abilities: [{ name, timing }]
// FactionRules = { battleTraits: [Ability], formations: [{ name, abilities }], enhancementTables: [{ id, name, items: [Enh] }],
//                  lores: { spell: [Lore], prayer: [Lore], manifestation: [Lore] }, terrain: [{ name, points, abilities }] }
// Enh          = { name, points?, restrict?: { keywords?: [..], names?: [..] }, abilities: [Ability] }
// Lore         = { name, points?, items: [Ability] }
// Ability      = { name, timing, text, text_en?, timing_en? }   (text = eigene Kurzfassung; Regeltexte werden nicht kopiert)
// RoR          = { name, points, factions: [..], units: [{ name, count }], abilities: [Ability] }

const STUB = 'Noch keine Zusammenfassung, bitte die Warscroll lesen.';
const srcKey = s => String(s || '').toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]/g, '');
const nameTokens = n => new Set(String(n).toLowerCase().replace(/[’']/g, '').replace(/scourge of \w+:?/, '').split(/[^a-z0-9]+/).filter(t => t && !['the', 'with', 'of', 'and', 'on', 'ogor'].includes(t)));
function sameUnitName(a, b) {
  const sa = (String(a).match(/scourge of (\w+)/i) || [])[1], sb = (String(b).match(/scourge of (\w+)/i) || [])[1]; if ((sa || '').toLowerCase() !== (sb || '').toLowerCase()) return false;
  const A = nameTokens(a), B = nameTokens(b); if (!A.size || !B.size) return false;
  const [s, l] = A.size <= B.size ? [A, B] : [B, A]; return [...s].every(t => l.has(t)) && l.size - s.size <= 1;
}
// Gleiche Einheit trotz unterschiedlicher Schreibweise („Scourge of Ghyran Mortek Guard“ = „Mortek Guard (Scourge of Ghyran)“)
const unitCanon = n => { const s = String(n || ''), m = s.match(/scourge of (\w+)/i); return srcKey(s.replace(/\(?scourge of \w+\)?:?/i, '')) + (m ? '|' + m[1].toLowerCase() : ''); };

// ---------- Generischer Abgleich der Einheiten (gilt für jede Quelle) ----------
function sourceStamp(label, ver) { return `Werte: ${label} (${ver ? 'Datenversion ' + ver + ', ' : ''}Stand ${new Date().toISOString().slice(0, 10)}). Fertigkeiten: eigene Kurzfassung, maßgeblich ist die Warscroll.`; }
function mergeUnits(data, norm, src, meta) {
  const facs = new Set(data.factions.map(f => f.name)), seen = new Set();
  const rep = { changed: [], added: [], gone: [], check: [] };
  const stamp = sourceStamp(src.label, meta && meta.dataVersion);
  for (const nu0 of norm) {
    const fac = nu0.faction; if (!facs.has(fac)) continue;
    const key = fac + '\n' + unitCanon(nu0.name); if (seen.has(key)) continue; seen.add(key);
    const nu = clone(nu0), abil = (nu.abilities || []).map(a => ({ name: a.name, timing: a.timing || '', text: a.text || STUB }));
    let old = data.units.find(u => u.faction === fac && u.name === nu.name) || data.units.find(u => u.faction === fac && unitCanon(u.name) === unitCanon(nu.name));
    if (!old) { // umbenannt? („Ogor Gluttons“ → „Gluttons“, „… with Greatbows“ → „… with Kurnoth Greatbows“)
      const cand = data.units.filter(u => u.faction === fac && !norm.some(x => x.faction === fac && unitCanon(x.name) === unitCanon(u.name)) && sameUnitName(u.name, nu.name));
      if (cand.length === 1) { old = cand[0]; rep.check.push(`${old.name} heißt jetzt „${nu.name}“`); old.aliases = [...new Set([...(old.aliases || []), old.name])]; old.name = nu.name; }
    }
    if (!old) {
      if (!(+nu.points > 0)) continue;
      nu.weapons = nu.weapons.filter(w => w.hit && w.wound);
      nu.abilities = abil; nu.source = stamp; nu.sourceId = src.id;
      data.units.push(nu); rep.added.push(`${nu.name} (${fac}, ${nu.points} P.)`);
      continue;
    }
    const diffs = [];
    if (String(old.points) !== String(nu.points)) { diffs.push(`Punkte ${old.points} → ${nu.points}`); old.points = String(nu.points); }
    const oldModels = old.def.models;
    if (src.id === 'bsdata' && nu.def.models === 1 && old.def.models > 1) { rep.check.push(`${old.name}: Modellzahl in der Quelle nicht erkannt, bleibt ${old.def.models}`); nu.def.models = old.def.models; nu.weapons.forEach(w => { if (w.models === 1) w.models = old.def.models; }); }
    if (src.conservative && old.def.models !== nu.def.models) { rep.check.push(`${old.name}: Modellzahl laut Quelle ${nu.def.models} statt ${old.def.models}, nicht übernommen`); nu.def.models = old.def.models; nu.weapons.forEach(w => { if (w.models > old.def.models) w.models = old.def.models; }); }
    for (const k of ['models', 'health', 'save', 'ward']) {
      if (old.def[k] !== nu.def[k]) {
        const lbl = { models: 'Modelle', health: 'Lebenspunkte', save: 'Rüstung', ward: 'Ward' }[k];
        diffs.push(`${lbl} ${old.def[k] || '–'} → ${nu.def[k] || '–'}`); old.def[k] = nu.def[k];
      }
    }
    for (const nw of nu.weapons) {
      let ow = old.weapons.find(w => srcKey(w.name) === srcKey(nw.name) && !!w.ranged === nw.ranged);
      if (!ow) { // nur anders geschrieben? Gleiche Werte → alten Namen behalten
        const sig = w => [!!w.ranged, w.attacks, w.hit, w.wound, w.rend, w.dmg].join('|');
        ow = old.weapons.find(w => sig(w) === sig(nw) && !nu.weapons.some(x => srcKey(x.name) === srcKey(w.name)));
        if (ow) { nw.name = ow.name; }
      }
      if (!nw.hit || !nw.wound) continue; // Sonderprofile (z. B. „✹“) bleiben wie modelliert
      if (!ow) {
        if ((old.optWeapons || []).some(n => srcKey(n) === srcKey(nw.name)) || srcKey(old.unitNote).includes(srcKey(nw.name))) continue; // bewusst weggelassene Wahlwaffe
        old.weapons.push(nw); diffs.push(`neue Waffe ${nw.name}`); continue;
      }
      if (ow.crit === 'mortal' && ow.critOn < 6 && ow.wound === 2 && ow.rend === 0) continue;
      for (const k of ['attacks', 'hit', 'wound', 'rend', 'dmg', 'crit']) {
        if (String(ow[k]) !== String(nw[k])) { diffs.push(`${nw.name}: ${k === 'dmg' ? 'Schaden' : k === 'attacks' ? 'Attacken' : k} ${ow[k]} → ${nw[k]}`); ow[k] = nw[k]; }
      }
      if (nw.wabil) ow.wabil = nw.wabil; else delete ow.wabil;
      if (oldModels !== nu.def.models && ow.models === oldModels) ow.models = nu.def.models;
      if (src.conservative) nw.models = ow.models;
    }
    if (oldModels !== nu.def.models && old.weapons.some(w => w.models !== nu.def.models)) rep.check.push(`${old.name}: Modellzahl geändert, Waffenverteilung prüfen`);
    const gone = old.weapons.filter(w => !nu.weapons.some(n => srcKey(n.name) === srcKey(w.name) && n.ranged === !!w.ranged) && !(w.hit && w.wound ? false : true));
    if (gone.length && src.conservative) rep.check.push(`${old.name}: Waffe nicht in der Quelle (bleibt): ${gone.map(w => w.name).join(', ')}`);
    else if (gone.length) { old.weapons = old.weapons.filter(w => !gone.includes(w)); diffs.push(`Waffe entfernt: ${gone.map(w => w.name).join(', ')}`); }
    if (!!old.legends !== !!nu.legends) { diffs.push(nu.legends ? 'jetzt Legends' : 'nicht mehr Legends'); old.legends = !!nu.legends; }
    old.keywords = nu.keywords;
    if (nu.unitNote != null && nu.unitNote !== old.unitNote) old.unitNote = nu.unitNote;
    // Listenbau-Daten kommen immer aus der Quelle

      rules.sources = { ...(rules.sources || {}), [src.id]: { label: src.label, dataVersion: parsed.meta && parsed.meta.dataVersion || '', updated: new Date().toISOString().slice(0, 10) } };

    } catch (err) {
      result = null;
      out.innerHTML = `<p class="hint">Die Datei wurde nicht erkannt (${esc(err.message || err)}).</p>`;
    }
  });
}

}

  const catName = new Map(docs.map(d => [bsAttr(d.root, 'id'), bsAttr(d.root, 'name')]));
  const baseFac = n => String(n || '').replace(/\s*\[LEGENDS\]\s*/, '').split(' - ')[0].trim();
  const isPtG = el => /path to glory/i.test(docOf.get(el) || '') || BS_SKIP_GROUPS.test(bsAttr(el, 'name'));
  const tgt = l => byId.get(bsAttr(l, 'targetId')) || null;
  const gst = docs.find(d => d.root.localName === 'gameSystem');
  const meta = { dataVersion: gst ? 'r' + bsAttr(gst.root, 'revision') : '' };
  const known = new Set(knownFactions || []);
  const facName = d => bsAttr(d.root, 'name').replace(/\s*\[LEGENDS\]\s*$/, '');
  const facDocs = docs.filter(d => d.root.localName === 'catalogue' && bsAttr(d.root, 'library') !== 'true' && !/ - /.test(bsAttr(d.root, 'name')) && (known.size ? known.has(facName(d)) : !/Lores|Regiments of Renown|Path to Glory/.test(bsAttr(d.root, 'name'))));

  // Alle Kinder-Einträge (inkl. Gruppen und Links) eines Elements, Links aufgelöst
  const children = e => [
    ...bsList(e, 'selectionEntries', 'selectionEntry'),
    ...bsList(e, 'selectionEntryGroups', 'selectionEntryGroup'),
    ...bsList(e, 'entryLinks', 'entryLink').map(l => ({ link: l, el: tgt(l) })).filter(x => x.el).map(x => x)
  ].map(x => x.localName ? { el: x, link: null } : x);
  const profilesDeep = (e, pred, seen = new Set()) => {
    const out = [];
    const walk = (el) => {
      if (!el || seen.has(el)) return; seen.add(el);
      for (const p of bsList(el, 'profiles', 'profile')) if (pred(p)) out.push(p);
      for (const il of bsList(el, 'infoLinks', 'infoLink')) { const t = tgt(il); if (t && t.localName === 'profile' && pred(t)) out.push(t); }
      for (const c of children(el)) walk(c.el);
    };
    walk(e); return out;
  };
  const abilOf = p => {
    const a = { name: bsClean(bsAttr(p, 'name')), timing: bsClean(bsChar(p, 'Timing') || (/Passive/.test(bsAttr(p, 'typeName')) ? 'Passive' : '')) };
    if (TX) { // Originalwortlaut nur für den lokalen Regel-Speicher, nie für die veröffentlichte Seite
      const raw = n => { const c = bsList(p, 'characteristics', 'characteristic').find(x => bsAttr(x, 'name') === n); return c ? String(c.textContent).replace(/\^\^/g, '').replace(/\u00a0/g, ' ').trim() : ''; };
      a.declare = raw('Declare'); a.effect = raw('Effect'); a.kw = raw('Keywords'); a.cast = raw('Casting Value') || raw('Chanting Value') || raw('Banishment');
      a.type = bsAttr(p, 'typeName').replace(/^Ability \((.+)\)$/, '$1');
    }
    return a;
  };
  const isAbil = p => /^Ability/.test(bsAttr(p, 'typeName'));

  function weaponsOf(unitEl, total) {
    const acc = new Map();
    const addW = (p, n) => {
      const ab = bsChar(p, 'Ability').split(',').map(s => s.trim()).filter(s => s && s !== '-');
      const key = bsAttr(p, 'name') + '|' + bsAttr(p, 'typeName');
      if (acc.has(key)) { acc.get(key).models += n; return; }
      const crit = ab.includes('Crit (2 Hits)') ? 'two' : ab.includes('Crit (Mortal)') ? 'mortal' : ab.includes('Crit (Auto-wound)') ? 'auto' : 'none';
      const extra = ab.filter(a => !a.startsWith('Crit') && a !== 'Companion').join(', ');
      const w = { name: bsClean(bsAttr(p, 'name')), models: n, attacks: bsChar(p, 'Atk'), hit: parseInt(bsChar(p, 'Hit')) || 0, wound: parseInt(bsChar(p, 'Wnd')) || 0,
        rend: parseInt(bsChar(p, 'Rnd')) || 0, dmg: bsChar(p, 'Dmg'), crit, critOn: 6, champ: !ab.includes('Companion'), rrHit: 'none', rrWound: 'none', ranged: /Ranged/.test(bsAttr(p, 'typeName')) };
      if (extra) w.wabil = extra;
      acc.set(key, w);
    };
    // Waffen unterhalb eines Elements; bei Auswahlgruppen nur die Standard-/erste Option
    const collect = (el, n, seen = new Set()) => {
      if (!el || seen.has(el)) return; seen.add(el);
      for (const p of bsList(el, 'profiles', 'profile')) if (/Weapon/.test(bsAttr(p, 'typeName'))) addW(p, n);
      for (const c of children(el)) {
        const t = bsAttr(c.el, 'type');
        if (t === 'model' || t === 'unit') continue;
        if (c.el.localName === 'selectionEntryGroup') {
          const def = bsAttr(c.el, 'defaultSelectionEntryId'), opts = children(c.el);
          const pick = opts.find(o => bsAttr(o.link || o.el, 'id') === def || bsAttr(o.el, 'id') === def) || (bsMin(c.el) > 0 || opts.every(o => bsMin(o.link || o.el) === 0) ? opts[0] : null);
          if (/command models/i.test(bsAttr(c.el, 'name'))) continue;
          if (pick) collect(pick.el, n, seen);
          continue;
        }
        if (bsMin(c.link || c.el) > 0 || bsAttr(c.el, 'type') === 'upgrade' && bsMin(c.el) > 0) collect(c.el, n, seen);
      }
    };
    const models = [];
    const findModels = (el, seen = new Set()) => { if (!el || seen.has(el)) return; seen.add(el); for (const c of children(el)) { if (bsAttr(c.el, 'type') === 'model') models.push({ el: c.el, n: bsMin(c.link || c.el) || bsMin(c.el) }); else if (c.el.localName === 'selectionEntryGroup') findModels(c.el, seen); } };
    findModels(unitEl);
    collect(unitEl, total);
    for (const m of models) collect(m.el, m.n || 1);
    return [...acc.values()];
  }

  function unitFrom(link, el, faction) {
    const cats = [...bsList(el, 'categoryLinks', 'categoryLink'), ...(link ? bsList(link, 'categoryLinks', 'categoryLink') : [])].map(c => bsAttr(c, 'name'));
    const up = new Set([...BS_ALLIANCES, faction.toUpperCase()]);
    const kw = [...new Set(cats.filter(c => !up.has(c.toUpperCase())).map(bsTitle))];
    const up2 = cats.map(c => c.toUpperCase());
    const prof = bsList(el, 'profiles', 'profile').find(p => bsAttr(p, 'typeName') === 'Unit');
    let models = 0; const mm = []; (function f(e, seen = new Set()) { if (seen.has(e)) return; seen.add(e); for (const c of children(e)) { if (bsAttr(c.el, 'type') === 'model') { const n = bsMin(c.link || c.el) || bsMin(c.el) || 1; models += n; mm.push(n); } else if (c.el.localName === 'selectionEntryGroup') f(c.el, seen); } })(el);
    if (!models) models = 1;
    const wardKw = cats.find(c => /^WARD \((\d)\+\)/i.test(c));
    const reinforce = [...bsList(link || el, 'entryLinks', 'entryLink'), ...bsList(el, 'entryLinks', 'entryLink')].some(l => /^reinforced$/i.test(bsAttr(l, 'name')));
    const u = { name: bsUnitName(bsClean(bsAttr(el, 'name'))), faction, points: String(bsCost(link) ?? bsCost(el) ?? 0), champion: up2.some(c => c.startsWith('CHAMPION')),
      reinforced: false, active: true, open: false, weapons: weaponsOf(el, models),
      def: { models, health: prof ? parseInt(bsChar(prof, 'Health')) || 1 : 1, save: prof ? parseInt(bsChar(prof, 'Save')) || 7 : 7, ward: wardKw ? +wardKw.match(/(\d)/)[1] : 0 },
      keywords: kw, legends: /\[LEGENDS\]/i.test(bsAttr(el, 'name')) || up2.includes('LEGENDS'),
      abilities: [...bsList(el, 'profiles', 'profile'), ...bsList(el, 'infoLinks', 'infoLink').map(tgt).filter(t => t && t.localName === 'profile')].filter(isAbil).map(abilOf) };
    if (!reinforce && models > 1) u.noReinforce = true;
    if (TX) {
      const wp = []; const seenW = new Set();
      (function f(e, seen = new Set()) { if (!e || seen.has(e)) return; seen.add(e);
        for (const p of bsList(e, 'profiles', 'profile')) if (/Weapon/.test(bsAttr(p, 'typeName')) && !seenW.has(bsAttr(p, 'name') + bsAttr(p, 'typeName'))) { seenW.add(bsAttr(p, 'name') + bsAttr(p, 'typeName'));
          wp.push({ name: bsClean(bsAttr(p, 'name')), ranged: /Ranged/.test(bsAttr(p, 'typeName')), range: bsChar(p, 'Rng'), atk: bsChar(p, 'Atk'), hit: bsChar(p, 'Hit'), wnd: bsChar(p, 'Wnd'), rnd: bsChar(p, 'Rnd'), dmg: bsChar(p, 'Dmg'), ab: bsChar(p, 'Ability') }); }
        for (const c of children(e)) if (!isPtG(c.el)) f(c.el, seen); })(el);
      u.ref = { move: prof ? bsChar(prof, 'Move') : '', control: prof ? bsChar(prof, 'Control') : '', banish: prof ? bsChar(prof, 'Banishment') : '', keywordsAll: [...new Set(cats)], weapons: wp,
        abilitiesFull: [...bsList(el, 'profiles', 'profile'), ...bsList(el, 'infoLinks', 'infoLink').map(tgt).filter(t => t && t.localName === 'profile')].filter(isAbil).map(abilOf) };
    }
    return u;
  }

  // Regimentsoptionen: Held als „Regimental Leader“ fügt Einheiten/Schlüsselwörtern die Kategorie „Regimental Option/Hero“ hinzu;
  // Höchstzahlen („0-1 …“) stehen als Modifikator am Eintrag der Einheit, bei Beitritts-Helden an deren Kategorie.
  const RO_CATS = { option: 'regimental option', hero: 'regimental hero' };
  const catNameOf = id => { const e = byId.get(id); return e ? bsAttr(e, 'name') : ''; };
  function catalogueParse(d, fac) {
    const root = d.root, links = bsList(root, 'entryLinks', 'entryLink');
    const maxMap = new Map(); // heroLinkId → Map(unitTargetId → max)
    for (const l of links) {
      const cons = bsList(l, 'constraints', 'constraint').filter(c => bsAttr(c, 'type') === 'max');
      if (!cons.length) continue;
      const mods = l.getElementsByTagName('modifier');
      for (let k = 0; k < mods.length; k++) {
        const m = mods[k]; if (bsAttr(m, 'type') !== 'set' || !cons.some(c => bsAttr(c, 'id') === bsAttr(m, 'field'))) continue;
        const conds = m.parentNode.parentNode.getElementsByTagName('condition');
        for (let q = 0; q < conds.length; q++) { const hid = bsAttr(conds[q], 'childId'); if (!maxMap.has(hid)) maxMap.set(hid, new Map()); maxMap.get(hid).set(bsAttr(l, 'targetId'), +bsAttr(m, 'value')); maxMap.get(hid).set(bsAttr(l, 'id'), +bsAttr(m, 'value')); }
      }
    }
    const heroMax = catId => { const ce = byId.get(catId); if (!ce) return 1; const m = [...ce.getElementsByTagName('modifier')].find(x => bsAttr(x, 'type') === 'set'); const v = m ? +bsAttr(m, 'value') : 1; return v < 0 ? null : v || 1; };
    const subCats = new Set(), optsBy = new Map();
    for (const l of links) {
      const opts = [], mods = l.getElementsByTagName('modifier');
      for (let k = 0; k < mods.length; k++) {
        const m = mods[k], af = bsAttr(m, 'affects');
        if (bsAttr(m, 'field') !== 'category' || bsAttr(m, 'type') !== 'add' || !af.startsWith('self.entries.recursive.')) continue;
        const kind = catNameOf(bsAttr(m, 'value')).toLowerCase(), id = af.split('.').pop(), t = byId.get(id) || linkById.get(id); if (!t) continue;
        const nm = bsClean(bsAttr(t, 'name'));
        if (kind === RO_CATS.hero) { subCats.add(id); const mx = heroMax(id); opts.push({ label: mx == null ? `Any ${nm}` : `0-${mx} ${nm}`, match: nm, min: 0, max: mx }); }
        else if (kind === RO_CATS.option) {
          if (t.localName === 'categoryEntry') opts.push({ label: `Any ${nm}`, match: nm, min: 0, max: null });
          else { const mx = (maxMap.get(bsAttr(l, 'id')) || new Map()).get(id); const un = bsUnitName(nm); const ok = mx != null && mx > 0; opts.push({ label: ok ? `0-${mx} ${un}` : `Any ${un}`, match: un, min: 0, max: ok ? mx : null }); }
        }
      }
      if (opts.length) optsBy.set(l, opts);
    }
    const joinOf = l => { const mods = l.getElementsByTagName('modifier'); for (let k = 0; k < mods.length; k++) { const m = mods[k]; if (!bsAttr(m, 'affects') && bsAttr(m, 'field') === 'category' && bsAttr(m, 'type') === 'add' && subCats.has(bsAttr(m, 'value'))) return catNameOf(bsAttr(m, 'value')); } return null; };

    const fr = { battleTraits: [], formations: [], enhancementTables: [], lores: { spell: [], prayer: [], manifestation: [] }, terrain: [] }, us = [];
    const heroTables = new Set(), nonHeroTables = new Set();
    for (const l of links) {
      const el = tgt(l); if (!el || el.localName !== 'selectionEntry' || bsAttr(el, 'type') !== 'unit') continue;
      if (/anvil of apotheosis/i.test(bsAttr(el, 'name'))) continue; // Path to Glory
      const u = unitFrom(l, el, fac);
      const ro = optsBy.get(l); if (ro) u.regimentOptions = ro;
      const ja = joinOf(l); if (ja) u.joinAs = ja;
      if (bsList(l, 'constraints', 'constraint').some(c => bsAttr(c, 'type') === 'min' && +bsAttr(c, 'value') > 0)) u._required = true;
      const isHeroU = u.keywords.some(k => /^hero$/i.test(k));
      for (const g of bsList(l, 'entryLinks', 'entryLink')) if (bsAttr(g, 'type') === 'selectionEntryGroup' && !BS_SKIP_GROUPS.test(bsAttr(g, 'name'))) (isHeroU ? heroTables : nonHeroTables).add(bsAttr(g, 'targetId'));
      if (u.keywords.some(k => /faction terrain/i.test(k))) { fr.terrain.push({ name: u.name, points: +u.points || 0, abilities: u.abilities }); continue; }
      us.push(u);
    }
    // Battle Traits, Formationen, Lehren, Enhancements (Einträge auf oberster Ebene des Katalogs)
    const topEntries = [...bsList(root, 'selectionEntries', 'selectionEntry'), ...bsList(root, 'sharedSelectionEntries', 'selectionEntry'), ...links.map(tgt).filter(Boolean)];
    const groups = [...bsList(root, 'sharedSelectionEntryGroups', 'selectionEntryGroup'), ...bsList(root, 'selectionEntryGroups', 'selectionEntryGroup')];
    const bt = topEntries.find(e => /^battle traits/i.test(bsAttr(e, 'name')));
    if (bt) fr.battleTraits = profilesDeep(bt, isAbil).map(abilOf);
    const items = g => children(g).filter(c => !isPtG(c.el) && !/^\d+\/\d+\s*:/.test(bsAttr(c.el, 'name'))).flatMap(c => c.el.localName === 'selectionEntryGroup' ? items(c.el) : [{ el: c.el, link: c.link }]);
    for (const g of groups) {
      const gn = bsAttr(g, 'name');
      if (/^battle formations/i.test(gn)) fr.formations = items(g).map(x => ({ name: bsClean(bsAttr(x.el, 'name')), abilities: profilesDeep(x.el, isAbil).map(abilOf) }));
      const lk = /^spell lores?$/i.test(gn) ? 'spell' : /^prayer lores?$/i.test(gn) ? 'prayer' : /^manifestation lores?$/i.test(gn) ? 'manifestation' : null;
      if (lk) fr.lores[lk] = items(g).map(x => ({ name: bsClean(bsAttr(x.el, 'name')), points: bsCost(x.link || x.el) ?? bsCost(x.el) ?? 0,
        items: profilesDeep(x.el, p => /Spell|Prayer/.test(bsAttr(p, 'typeName'))).map(p => ({ ...abilOf(p), cast: bsChar(p, 'Casting Value') || bsChar(p, 'Chanting Value') || '' })) }));
      const id = bsAttr(g, 'id');
      if (heroTables.has(id) || nonHeroTables.has(id)) {
        const its = items(g).filter(x => bsAttr(x.el, 'type') === 'upgrade');
        if (its.length) fr.enhancementTables.push({ id: srcKey(gn), name: bsClean(gn), nonHero: nonHeroTables.has(id) && !heroTables.has(id), perArmy: 1, ...(/monstrous/i.test(gn) ? { restrict: { keywords: ['Monster'] } } : {}),
          items: its.map(x => ({ name: bsClean(bsAttr(x.el, 'name')), points: bsCost(x.link || x.el) ?? bsCost(x.el) ?? 0, abilities: profilesDeep(x.el, isAbil).map(abilOf) })) });
      }
    }
    return { fr, units: us };
  }

  const units = [], factions = {};
  for (const d of facDocs) {
    const fac = facName(d), legendsFac = /\[LEGENDS\]/.test(bsAttr(d.root, 'name'));
    const { fr, units: us } = catalogueParse(d, fac);
    for (const u of us) { if (legendsFac) u.legends = true; delete u._required; units.push(u); }
    // Armies of Renown: eigene Kataloge „Fraktion - Name“ (Legends ausgenommen). Nur was sie ändern, wird gespeichert.
    fr.armiesOfRenown = docs.filter(x => bsAttr(x.root, 'name').startsWith(fac + ' - ') && !/Library|\[LEGENDS\]/.test(bsAttr(x.root, 'name'))).map(x => {
      const { fr: ar, units: au } = catalogueParse(x, fac);
      const a = { name: bsAttr(x.root, 'name').slice(fac.length + 3).trim(), units: au.map(u => u.name), required: au.filter(u => u._required).map(u => u.name) };
      if (ar.battleTraits.length) a.battleTraits = ar.battleTraits;
      if (ar.formations.length) a.formations = ar.formations;
      if (ar.enhancementTables.length) a.enhancementTables = ar.enhancementTables;
      const lo = Object.fromEntries(Object.entries(ar.lores).filter(([, v]) => v.length)); if (Object.keys(lo).length) a.lores = lo;
      if (ar.terrain.length) a.terrain = ar.terrain;
      const ro = {}; for (const u of au) if (u.regimentOptions) { const b = us.find(z => z.name === u.name); if (!b || JSON.stringify(b.regimentOptions) !== JSON.stringify(u.regimentOptions)) ro[u.name] = u.regimentOptions; }
      if (Object.keys(ro).length) a.regimentOptions = ro;
      return a;
    }).filter(a => a.units.length);
    factions[fac] = fr;
  }
  // Regiments of Renown: Punkte und erlaubte Fraktionen am Force-Eintrag im .gst, Einheiten im Katalog „Regiments of Renown“.
  let regimentsOfRenown = null;
  const rorDoc = docs.find(d => /Regiments of Renown/i.test(bsAttr(d.root, 'name')) && d.root.localName === 'catalogue');
  if (gst && rorDoc) {
    regimentsOfRenown = [];
    const rorAbil = [...bsList(rorDoc.root, 'sharedSelectionEntries', 'selectionEntry')].filter(e => /^Regiment of Renown:/i.test(bsAttr(e, 'name')));
    const rorLinks = bsList(rorDoc.root, 'entryLinks', 'entryLink');
    for (const f of bsList(gst.root, 'forceEntries', 'forceEntry')) {
      const pts = bsCost(f), fid = bsAttr(f, 'id'), nm = bsClean(bsAttr(f, 'name'));
      if (!pts || /handbook|path to glory|^regiment$|auxil/i.test(nm)) continue;
      const conds = [...f.getElementsByTagName('condition')].map(c => catName.get(bsAttr(c, 'childId'))).filter(Boolean);
      const facs = [...new Set(conds.map(baseFac))].filter(x => !/Regiments of Renown|Lores/.test(x));
      const us = [];
      for (const l of rorLinks) {
        for (const mg of [...l.getElementsByTagName('modifierGroup')]) {
          if (![...mg.getElementsByTagName('condition')].some(c => bsAttr(c, 'childId') === fid)) continue;
          const minC = bsList(l, 'constraints', 'constraint').find(c => bsAttr(c, 'type') === 'min');
          const setMin = [...mg.getElementsByTagName('modifier')].find(m => minC && bsAttr(m, 'field') === bsAttr(minC, 'id'));
          us.push({ name: bsUnitName(bsClean(bsAttr(l, 'name'))), count: setMin ? +bsAttr(setMin, 'value') || 1 : 1 });
        }
      }
      const ae = rorAbil.find(e => srcKey(bsAttr(e, 'name').replace(/^Regiment of Renown:\s*/i, '')) === srcKey(nm));
      regimentsOfRenown.push({ name: nm, points: pts, factions: facs, units: us, abilities: ae ? profilesDeep(ae, isAbil).map(abilOf) : [] });
    }
    regimentsOfRenown = regimentsOfRenown.filter(r => r.units.length).sort((a, b) => a.name.localeCompare(b.name));
  }
  // Battle-Tactic-Karten je General's Handbook (Saison aus der Sichtbarkeitsbedingung der Kartengruppe)
  const battleTactics = [];
  if (gst) {
    const forceName = new Map(bsList(gst.root, 'forceEntries', 'forceEntry').map(f => [bsAttr(f, 'id'), bsAttr(f, 'name')]));
    for (const se of gst.root.getElementsByTagName('selectionEntry')) {
      if (bsAttr(se, 'name') !== 'Battle Tactic Cards') continue;
      for (const g of bsList(se, 'selectionEntryGroups', 'selectionEntryGroup')) {
        const c = g.getElementsByTagName('condition')[0], cn = c ? (bsAttr(c, 'childName') || forceName.get(bsAttr(c, 'childId')) || '') : '';
        const season = (cn.match(/(\d{4}-\d{2})/) || [])[1] || '';
        for (const e of bsList(g, 'selectionEntries', 'selectionEntry')) {
          const p = bsList(e, 'profiles', 'profile').find(x => /Battle Tactic Card/.test(bsAttr(x, 'typeName'))); if (!p) continue;
          const raw = n => { const ch = bsList(p, 'characteristics', 'characteristic').find(x => bsAttr(x, 'name') === n); return ch ? String(ch.textContent).replace(/\u00a0/g, ' ').trim() : ''; };
          const tiers = ['Affray', 'Strike', 'Domination'].map(t => { const r = raw(t), i = r.indexOf(':'); return { tier: t, name: i > 0 ? r.slice(0, i).trim() : r.slice(0, 40), ...(TX ? { text: i > 0 ? r.slice(i + 1).trim() : r } : {}) }; });
          battleTactics.push({ name: bsClean(bsAttr(e, 'name')), season, tiers, ...(TX ? { card: raw('Card') } : {}) });
        }
      }
    }
  }
  const out = { meta, units, factions, regimentsOfRenown, battleTactics };
  if (TX && gst) {
    out.glossary = [...bsList(gst.root, 'sharedRules', 'rule').map(r => ({ name: bsClean(bsAttr(r, 'name')), text: String((bsKid(r, 'description') || {}).textContent || '').replace(/\^\^/g, '').trim() })),
      ...bsList(gst.root, 'sharedProfiles', 'profile').filter(isAbil).map(p => { const a = abilOf(p); return { name: a.name, text: [a.declare && 'Declare: ' + a.declare, a.effect].filter(Boolean).join('\n') }; })];
  }
  return out;
}

DataSources.register({
  id: 'bsdata', label: 'BSData (BattleScribe, GitHub)', accept: '.zip,.cat,.gst',
  hint: '1. <b>github.com/BSData/age-of-sigmar-4th</b> öffnen → „Code“ → „Download ZIP“ (geht auch am Handy).<br>2. Die ZIP-Datei hier auswählen. Punkte, Werte, Formationen, Enhancements und Lehren aller Fraktionen werden abgeglichen; deine Fertigkeiten-Texte und Regimentsoptionen bleiben erhalten.',
  binary: true, conservative: true,
  detect: (text, name) => /\.(zip|cat|gst)$/i.test(name || '') || /battlescribe\.net\/schema/.test(String(text).slice(0, 3000)),
  async parseFiles(fileList) {
    let files = [];
    for (const f of fileList) {
      if (/\.zip$/i.test(f.name)) files.push(...await bsUnzip(await f.arrayBuffer()));
      else files.push({ name: f.name, text: await f.text() });
    }
    if (!files.length) throw new Error('keine .cat/.gst-Dateien gefunden');
    return bsParse(files, sharedView().factions.map(x => x.name));
  }
});

document.getElementById('sharedPane').addEventListener('click', e => {
  const b = e.target.closest('button[data-sh]'); if (!b) return;
  const data = sharedView();
  switch (b.dataset.sh) {
    case 'load': loadUnit(data.units[+b.dataset.i]); break;
    case 'del': {
      const u = data.units[+b.dataset.i];
      askConfirm(`„${u.name}“ aus der gemeinsamen Bibliothek löschen?`, 'Löschen').then(ok => {
        if (ok) editShared(d => { const i = d.units.findIndex(x => x.name === u.name && x.faction === u.faction); if (i >= 0) d.units.splice(i, 1); });
      });
      break;
    }
    case 'delfac': {
      const f = b.dataset.f, n = data.units.filter(u => u.faction === f).length;
      askConfirm(n ? `„${f}“ und ihre ${n} Einheit${n === 1 ? '' : 'en'} entfernen?` : `„${f}“ entfernen?`, 'Entfernen').then(ok => {
        if (ok) editShared(d => { d.factions = d.factions.filter(x => x.name !== f); d.units = d.units.filter(u => u.faction !== f); });
      });
      break;
    }
    case 'addfac': openAddFaction(); break;
    case 'import': openSharedImport(); break;
    case 'aoi': openDataUpdate(); break;
    case 'publish': publishShared(b); break;
    case 'discard':
      askConfirm('Alle nicht veröffentlichten Änderungen an der gemeinsamen Bibliothek verwerfen?', 'Verwerfen').then(ok => {
        if (ok) { draft = null; store.set('aos2-shared-draft', null); renderShared(); renderUnits(); }
      });
      break;
  }
});
