<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AoS Einheitenrechner</title>
<style id="app-style">
:root {
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  --ga-order: #3a73b8; --ga-chaos: #b23a3a; --ga-death: #7d5aa6; --ga-destruction: #4f8a3a; --warn: #b7791f;
  --bg: #f6f3ec; --panel: #ffffff; --ink: #1f1c17; --muted: #6b6457; --line: #e2dccf;
  --accent: #a8741a; --accent-ink: #ffffff; --grid: #ece6da; --bar: #b98424; --curve: #3b5b8c; --danger: #a23b2a; --ok: #3f7d4a;
  --s1: #5a3a06; --s2: #8a5a0e; --s3: #b98424; --s4: #d9a441; --s5: #e9c77d; --s6: #9a9a9a;
  --c0: #b07a1c; --c1: #3b6fb0; --c2: #4f8a4f; --c3: #b0506e; --c4: #7a62b8; --c5: #2f8a8a; --c6: #c0632f; --c7: #6b6457;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #15130f; --panel: #1f1c17; --ink: #eee8dc; --muted: #a49c8c; --line: #37322a;
    --accent: #d9a441; --accent-ink: #15130f; --grid: #2c2821; --bar: #d9a441; --curve: #8fb2e6; --danger: #e27b67; --ok: #7fc28a;
    --s1: #fbe2a8; --s2: #f0c565; --s3: #d9a441; --s4: #b07d22; --s5: #7d5812; --s6: #6d6a64;
    --c0: #e0ac48; --c1: #79a6e8; --c2: #86c47f; --c3: #e38aa6; --c4: #ac98ee; --c5: #5fc4c4; --c6: #ee9563; --c7: #a8a091;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
    --bg: #15130f; --panel: #1f1c17; --ink: #eee8dc; --muted: #a49c8c; --line: #37322a;
    --accent: #d9a441; --accent-ink: #15130f; --grid: #2c2821; --bar: #d9a441; --curve: #8fb2e6; --danger: #e27b67; --ok: #7fc28a;
    --s1: #fbe2a8; --s2: #f0c565; --s3: #d9a441; --s4: #b07d22; --s5: #7d5812; --s6: #6d6a64;
    --c0: #e0ac48; --c1: #79a6e8; --c2: #86c47f; --c3: #e38aa6; --c4: #ac98ee; --c5: #5fc4c4; --c6: #ee9563; --c7: #a8a091;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
header { max-width: 1280px; margin: 0 auto; padding: 24px 16px 8px; display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 26px; }
header p { margin: 4px 0 0; color: var(--muted); }
.toolbar { display: flex; gap: 10px; flex-wrap: wrap; }
main { max-width: 1280px; margin: 0 auto; padding: 8px 16px 48px; display: grid; gap: 16px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.panel h2 { margin: 0; font-size: 17px; }
.panel h3 { margin: 14px 0 6px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.hint { color: var(--muted); font-size: 13px; }
button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 6px 12px; }
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
button.small { padding: 3px 9px; font-size: 13px; }
button.icon { padding: 3px 9px; color: var(--muted); }
button.icon:hover { color: var(--danger); border-color: var(--danger); }
label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
input, select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px; width: 100%; min-width: 0; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input.bad { border-color: var(--danger); outline-color: var(--danger); }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--uc, var(--accent)); margin: 0; }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) 300px; align-items: start; }
.unit { border: 1px solid var(--line); border-left: 5px solid var(--uc); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.unit.off { opacity: .55; }
.unit.invalid { border-color: var(--danger); }
.unit-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.unit-head .uname { font-weight: 600; flex: 1 1 180px; width: auto; }
.unit-head .pts { width: 90px; }
.unit-head input[type=color] { width: 34px; height: 32px; padding: 2px; cursor: pointer; flex: none; }
.unit-head .actions { display: flex; gap: 6px; margin-left: auto; }
.unit-summary { color: var(--muted); font-size: 13px; margin-top: 4px; }
.weapon {
  display: grid; gap: 8px; align-items: end; padding: 8px 0; border-top: 1px dashed var(--line);
  grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
}
.weapon .wide { grid-column: span 2; }
.chk { flex-direction: row; align-items: center; gap: 6px; font-size: 13px; color: var(--ink); cursor: pointer; white-space: nowrap; }
.weapon .chk { height: 36px; }
.chk.off-hint { color: var(--muted); }
.weapon:first-of-type { border-top: 0; }
.defrow { display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(90px, 160px)); }
.target { display: grid; gap: 10px; grid-template-columns: repeat(3, minmax(120px, 220px)); }

.lib-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-top: 1px solid var(--line); }
.lib-item:first-child { border-top: 0; }
.lib-item .meta { flex: 1; min-width: 0; }
.lib-item .meta b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib-item .meta span { color: var(--muted); font-size: 12px; }
.lib-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
td.best { font-weight: 700; color: var(--accent); }
td .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--uc); margin-right: 7px; }
.table-wrap { overflow-x: auto; }
.matrix td { text-align: center; vertical-align: middle; }
.matrix td:first-child { text-align: left; }
.matrix th { text-align: center; }
.matrix .big { font-weight: 700; font-size: 15px; color: var(--ink); }
.matrix .sub { font-size: 11px; color: var(--muted); }

.grid2 { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
.chart svg { width: 100%; height: auto; display: block; }
#distChart svg, #ehpChart svg { max-height: 360px; }
.chart text { fill: var(--muted); font-size: 11px; font-family: inherit; }
.chart .val { fill: var(--ink); font-size: 12px; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 12px; }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
.legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; background: var(--c); vertical-align: -1px; }
.readout { font-size: 13px; color: var(--muted); min-height: 20px; margin-top: 4px; font-variant-numeric: tabular-nums; }
.readout b { color: var(--ink); }
.note { font-size: 13px; color: var(--danger); margin-top: 6px; }
details summary { cursor: pointer; color: var(--muted); font-size: 13px; }
details.abil { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
details.abil > summary { font-weight: 600; color: var(--ink); }
.abil-body { display: grid; gap: 10px; margin-top: 10px; font-size: 13px; line-height: 1.5; max-width: 80ch; }
.abil-body p { margin: 0; }
.ab-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.ab-head b { color: var(--ink); }
.timing { color: var(--muted); font-size: 12px; }
.kw { display: flex; flex-wrap: wrap; gap: 4px; }
.kw span { border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--muted); }
.abil-body textarea { font: inherit; font-size: 13px; }
.src { color: var(--muted); font-size: 11px; }
details ul { color: var(--muted); font-size: 13px; margin: 8px 0 0; padding-left: 18px; }
.hidden, [hidden] { display: none !important; }
.lib-search-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.lib-search-row .lib-search { flex: 1 1 150px; margin: 0; }
.lib-search-row button { flex: none; white-space: nowrap; }
details.grp { margin-left: 18px; }
details.grp > summary { list-style: none; display: flex; align-items: center; gap: 8px; padding: 4px 2px; font-size: 13px; color: var(--ink); }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: "▸"; color: var(--muted); font-size: 11px; width: 10px; }
details.grp[open] > summary::before { content: "▾"; }
details.fac details.grp .lib-item { margin-left: 10px; }
details.fac details.grp { margin-left: 12px; }
#sharedLib .lib-item .meta b { white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
details.grp .lib-item:first-of-type { border-top: 0; }
details.ga { border-top: 1px solid var(--line); }
details.ga:first-child { border-top: 0; }
details.ga > summary, details.fac > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 8px 2px; }
details.ga > summary::-webkit-details-marker, details.fac > summary::-webkit-details-marker { display: none; }
details.ga > summary { font-weight: 700; }
details.ga > summary::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--gac); flex: none; }
details.fac { margin-left: 12px; }
details.fac > summary { font-size: 14px; padding: 5px 2px; }
details.fac > summary::before, details.ga > summary::after { content: "▸"; color: var(--muted); font-size: 11px; width: 10px; }
details.ga > summary::after { content: none; }
details.fac[open] > summary::before { content: "▾"; }
details.fac .lib-item, details.fac .empty { margin-left: 18px; }
.count { margin-left: auto; color: var(--muted); font-size: 12px; font-weight: 400; font-variant-numeric: tabular-nums; }
.ga-Order { --gac: var(--ga-order); } .ga-Chaos { --gac: var(--ga-chaos); } .ga-Death { --gac: var(--ga-death); } .ga-Destruction { --gac: var(--ga-destruction); }
.tag { font-style: normal; color: var(--warn); font-weight: 600; }
.lib-item .note { display: block; }
.pending { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 12px; padding: 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 14%, transparent); font-size: 13px; }
.pending span { flex: 1 1 140px; }
.linkish { border: 0; padding: 2px 0; color: var(--muted); font-size: 12px; text-decoration: underline; margin: 2px 0 6px 18px; }
.linkish:hover { color: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.chips .chk { white-space: normal; }
.target-pick { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 12px; }
.target-pick label:first-child { flex: 1 1 260px; }
.target-pick .chk { height: 36px; }
.tcard { margin-top: 8px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 12%, transparent); font-size: 13px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tcard span { flex: 1 1 200px; }
.modrow { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); align-items: end; }
.modrow .wide { grid-column: span 2; }
.aoi-report { margin-top: 10px; max-height: 50vh; overflow: auto; font-size: 13px; }
.aoi-report ul { margin: 4px 0 8px; padding-left: 18px; }
.aoi-report li { margin: 2px 0; overflow-wrap: anywhere; }
.aoi-report summary { cursor: pointer; font-weight: 600; margin-top: 6px; }
html[lang="en"] [data-only="de"], html[lang="de"] [data-only="en"] { display: none !important; }
#toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
.modal[hidden] { display: none; }
.modal-box { background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 18px; width: 100%; max-width: 560px; max-height: calc(100% - 32px); overflow: auto; display: grid; gap: 12px; }
.modal-box h2 { margin: 0; font-size: 17px; }
.modal-box p { margin: 0; }
.modal-actions, .modal .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.modal .row { justify-content: flex-start; }
textarea { font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 8px; width: 100%; resize: vertical; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .grid2 { grid-template-columns: 1fr; }
}
@media (max-width: 600px) {
  .defrow, .target { grid-template-columns: repeat(2, 1fr); }
  .unit-head .actions { margin-left: 0; }
}

/* ===== List Builder ===== */
.head-left { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
#calcTools { display: flex; gap: 10px; flex-wrap: wrap; }
#calcTools[hidden] { display: none !important; }
.bl-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
.bl-grid .wide { grid-column: span 2; }
.reg { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
.reg.gen { border-left: 5px solid var(--accent); }
.reg.aux { border-style: dashed; margin-top: 14px; }
.reg-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.reg-head .count { margin-left: auto; }
.reg-opts { margin-top: 6px; }
.ent { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 7px 0; border-top: 1px solid var(--line); }
.reg-head + .ent, .reg-head + select + .ent { border-top: 0; }
.ent.lead .ent-main .linkname::before { content: "★ "; color: var(--accent); }
.ent.bad b, .ent.bad .linkname { color: var(--danger); }
.ent-main { min-width: 0; display: flex; flex-direction: column; }
.ent-main .linkname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ent-main .hint { font-size: 12px; }
.ent-ctl { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.ent-ctl .pts { min-width: 36px; text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.ent-enh { grid-column: 1 / -1; display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.addsel { margin-top: 8px; color: var(--muted); }
.row-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.bl-sum { margin-top: 14px; padding: 12px; border-radius: 10px; background: color-mix(in srgb, var(--accent) 10%, transparent); display: grid; gap: 6px; }
.bl-pts { font-size: 15px; font-variant-numeric: tabular-nums; }
.bl-pts b { font-size: 24px; }
.bl-pts.over b { color: var(--danger); }
.bar { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--accent); }
.bl-pts.over + .bar span { background: var(--danger); }
.ok { color: var(--ok); font-weight: 600; text-transform: none; letter-spacing: 0; }
h3 .tag { text-transform: none; letter-spacing: 0; color: var(--danger); }
.issues { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.issues li { display: grid; grid-template-columns: 18px 1fr; gap: 6px; align-items: start; }
.issues li > span { width: 18px; height: 18px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: var(--panel); background: var(--muted); }
.issues li.err > span { background: var(--danger); }
.issues li.warn > span { background: var(--warn); }
.issues li.err { color: var(--ink); }
.issues li.info { color: var(--muted); }
#blSide > select { width: 100%; }
table.evt tr.tot td { font-weight: 700; border-top: 2px solid var(--line); }
table.evt tr.tot.sub td { font-weight: 400; color: var(--muted); border-top: 0; }
@media (max-width: 600px) {
  .bl-grid .wide { grid-column: auto; }
  .ent { grid-template-columns: 1fr; }
  .ent-ctl { justify-content: flex-start; }
}

.linkname { border: 0; padding: 0; background: none; font: inherit; font-weight: 600; color: var(--ink); text-align: left; cursor: pointer; text-decoration: underline dotted var(--muted); text-underline-offset: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
.linkname:hover { color: var(--accent); }
.ent.lead .linkname::before { content: "★ "; color: var(--accent); }
.modal-box.wide { max-width: 820px; }
.ws-card { display: grid; gap: 10px; font-size: 13px; }
.ws-stats { display: flex; flex-wrap: wrap; gap: 8px; }
.ws-stats .st { border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; display: flex; flex-direction: column; align-items: center; min-width: 64px; }
.ws-stats .st span { font-size: 11px; color: var(--muted); }
.ws-stats .st b { font-size: 15px; }
table.wst { font-size: 13px; margin-bottom: 6px; }
table.wst td .hint { font-size: 11px; white-space: normal; }
table.wst abbr { text-decoration: underline dotted; cursor: help; }
.rt-ab { border-top: 1px dashed var(--line); padding-top: 8px; display: grid; gap: 4px; }
.rt-ab p { margin: 0; }
.rt-short { color: var(--ink); }
.rt-full { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; color: var(--ink); display: grid; gap: 4px; background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 0 6px 6px 0; }
.rt-full i { color: var(--muted); font-style: normal; font-weight: 600; }
.ref-sec { border-top: 1px solid var(--line); padding: 8px 0; }
.ref-sec > summary { font-weight: 700; display: flex; gap: 8px; }
.ref-grp h4, h4.ref-t { margin: 10px 0 2px; font-size: 14px; }
details.ws { border-top: 1px solid var(--line); }
details.ws > summary { display: flex; gap: 8px; padding: 6px 0; cursor: pointer; }
details.ws .ws-body { padding: 4px 0 12px; }
#rtFoot { max-width: 1280px; margin: 0 auto; padding: 0 16px 48px; }
#rtPanel ol { margin: 4px 0; padding-left: 20px; display: grid; gap: 6px; }
#rtPanel a { color: var(--accent); }
.btnlike { display: inline-flex; flex-direction: row; align-items: center; font-size: 13px; color: var(--accent-ink); background: var(--accent); border-radius: 8px; padding: 3px 9px; cursor: pointer; font-weight: 600; }
.ok-line { color: var(--ok); }

.bp-map { width: 100%; height: auto; display: block; border-radius: 8px; margin: 6px 0; }
.bp-list { display: grid; gap: 4px; }
.bp-list button { text-align: left; display: flex; gap: 8px; align-items: center; }
.bp-list button span { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 18px; }
.bp-list button.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); font-weight: 600; }
.bp-card { border-top: 1px solid var(--line); padding-top: 8px; display: grid; gap: 6px; }
.bp-card h4 { margin: 0; font-size: 15px; }
#plansView .legend span::before { background: var(--c); }
.tac-tiers { display: grid; gap: 2px; margin-top: 4px; font-size: 12px; color: var(--ink); }
.tac-tiers i { color: var(--muted); font-style: normal; display: inline-block; min-width: 76px; }
.legend .bp-ico::before { display: none; }
.legend .bp-ico { display: inline-flex; align-items: center; gap: 5px; }
.bl-cur { display: grid; gap: 2px; margin-top: 4px; }
.bl-cur b { font-size: 15px; }
.bl-lib { margin-top: 6px; border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; max-height: 320px; overflow: auto; }
.bl-lib details { border-top: 1px solid var(--line); }
.bl-lib details:first-child { border-top: 0; }
.bl-lib summary { cursor: pointer; display: flex; gap: 8px; align-items: center; padding: 6px 0; font-weight: 600; font-size: 13px; }

      </div>

        <div class="lib-search-row">
          <input id="sharedSearch" class="lib-search" type="search" placeholder="Einheit oder Fraktion suchen" aria-label="Gemeinsame Bibliothek durchsuchen">
          <button class="small" id="collapseAll" title="Alle Grand Alliances und Fraktionen einklappen">Alle einklappen</button>
        </div>
        <div id="sharedLib"></div>
        <div id="sharedTools"></div>
      </div>
      <div id="minePane" hidden>
        <div id="library"></div>
        <div class="lib-actions">
          <button class="small" id="backupLib">Sichern / Übertragen</button>
          <input type="file" id="importFile" accept=".json,application/json" class="hidden">
        </div>
        <div class="hint" style="margin-top:8px">Deine eigenen Einheiten, dauerhaft in diesem Browser auf diesem Gerät gespeichert. Über „Sichern / Übertragen“ bringst du sie auf ein anderes Gerät oder schickst sie jemandem.</div>
      </div>
    </aside>
  </div>

  <!-- OFFENSIVE -->
  <div id="offView" class="grid2" style="grid-template-columns:1fr">
    <section class="panel">
      <div class="panel-head"><h2>Ziel</h2><span class="hint">Werte des Gegners, gegen den gerechnet wird</span></div>
      <div class="target">
        <label>Ward des Ziels
          <select id="tWard"><option value="0">keiner</option><option value="6">6+</option><option value="5">5+</option><option value="4">4+</option><option value="3">3+</option></select>
        </label>
        <label>Lebenspunkte pro Modell
          <input id="tHealth" type="number" min="1" value="1">
        </label>
        <label>Schwelle „mind. X Schaden“
          <input id="tThresh" type="number" min="1" placeholder="auto">
        </label>
      </div>
      <div class="target-pick">
        <label>Ziel aus der Bibliothek (optional)<input id="tUnit" list="tUnitList" type="search" placeholder="Einheit suchen, z. B. Liberators" autocomplete="off"></label>
        <label class="chk" title="Doppelte Modellanzahl und Punkte des Ziels"><input type="checkbox" id="tReinf">Ziel verstärkt</label>
        <datalist id="tUnitList"></datalist>
      </div>
      <div id="tCard" class="tcard" hidden></div>
      <h3>Situation</h3>
      <div class="chips">
        <label class="chk" title="Aktiviert Charge (+1 Damage) und Fertigkeiten „nur nach Angriff“"><input type="checkbox" data-sit="charged">Angreifer hat angegriffen</label>
        <label class="chk" title="Aktiviert Anti-charge (+1 Rend)"><input type="checkbox" data-t="charged">Ziel hat angegriffen</label>
        <label class="chk"><input type="checkbox" data-t="saveMod">Ziel +1 Rüstung (All-out Defence)</label>
        <label class="chk"><input type="checkbox" data-t="hitMinus">−1 auf Treffer gegen das Ziel</label>
        <label class="chk"><input type="checkbox" data-t="woundMinus">−1 auf Verwunden gegen das Ziel</label>
        <label class="chk"><input type="checkbox" data-t="ignore1">Ziel ignoriert den 1. Schadenspunkt</label>
      </div>
      <h3>Schlüsselwörter des Ziels <span class="hint" style="text-transform:none;letter-spacing:0;font-weight:400">für Anti-X (+1 Rend)</span></h3>
      <div class="chips" id="kwChips"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 id="offTableTitle">Ø Schaden je Rüstungswurf</h2><span class="hint">Beste Einheit pro Spalte hervorgehoben</span></div>
      <div class="table-wrap"><table id="offTable"></table></div>
      <div class="note" id="offNote"></div>
    </section>

    <div class="grid2">
      <section class="panel chart">
        <div class="panel-head"><h2 id="avgTitle">Durchschnittlicher Schaden</h2></div>
        <div id="avgChart"></div>
        <div class="legend" id="avgLegend"></div>
      </section>
      <section class="panel chart">
        <div class="panel-head">
          <h2 id="cumTitle">Mindestens X Schaden</h2>
          <div class="seg saveSeg"></div>
        </div>
        <div id="cumChart"></div>
        <div class="legend" id="cumLegend"></div>
        <div class="readout" id="cumReadout"></div>
      </section>
    </div>

    <section class="panel">
      <div class="panel-head"><h2 id="selTitle">Details</h2><div class="seg saveSeg"></div></div>
      <div class="table-wrap"><table id="selTable"></table></div>
    </section>

    <section class="panel chart">
      <div class="panel-head">
        <h2>Verteilung einer Einheit</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <select id="detailUnit" style="width:auto"></select>
          <div class="seg saveSeg"></div>
        </div>
      </div>
      <div id="distChart"></div>
      <div class="legend"><span style="--c:var(--bar)">P(genau X)</span><span style="--c:var(--curve)">P(mindestens X)</span></div>
      <div class="readout" id="distReadout"></div>
    </section>
  </div>

  <!-- DEFENSIVE -->
  <div id="defView" class="grid2 hidden" style="grid-template-columns:1fr">
    <section class="panel">
      <div class="panel-head"><h2 id="ehpTitle">Effektive Lebenspunkte</h2><span class="hint">So viel Schaden vor Rüstungs- und Ward-Würfen braucht es im Schnitt, um die Einheit auszulöschen</span></div>
      <div class="table-wrap"><table id="ehpTable"></table></div>
      <div class="note" id="defNote"></div>
    </section>
    <section class="panel chart">
      <div class="panel-head"><h2 id="ehpChartTitle">Effektive Lebenspunkte je Rend</h2></div>
      <div id="ehpChart"></div>
      <div class="legend" id="ehpLegend"></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 id="mxTitle">Matchups: Angreifer gegen Verteidiger</h2><select id="mxDef" style="width:auto" aria-label="Verteidiger"></select></div>
      <div class="hint" id="mxHint" style="margin-bottom:8px"></div>
      <div class="table-wrap"><table id="matrix" class="matrix"></table></div>
    </section>
  </div>

  <section class="panel">
    <details>
      <summary>Wie wird gerechnet?</summary>
      <ul data-only="en">
        <li>Attacks and damage accept dice: <code>3</code>, <code>D3</code>, <code>D6+1</code>, <code>2D6</code>. Attacks are per model carrying the weapon.</li>
        <li>An unmodified 1 always fails. An unmodified hit roll at or above “Crit on” (default 6+) is a crit and always hits.</li>
        <li><b>Champion</b>: +1 attack for every weapon with “Champion +1” (exactly one model). Untick it for companion weapons or weapons the champion doesn’t carry.</li>
        <li><b>Reinforced</b>: models (weapons and defense) and points cost are doubled. Always enter the base unit.</li>
        <li><b>Crit (2 Hits)</b>: 2 hits instead of 1. <b>Crit (Auto-wound)</b>: no wound roll. <b>Crit (Mortal)</b>: damage is dealt as mortal damage, no wound and no save roll.</li>
        <li><b>Melee / Ranged / All</b> (top right): decides which weapons are included.</li>
        <li><b>Charge (+1 Damage)</b> counts for melee weapons when “Attacker charged” is ticked. <b>Anti-X (+1 Rend)</b> counts when the target has the keyword (Anti-charge: “Target charged”). In the matchups the defenders’ keywords are used.</li>
        <li><b>Modifiers</b>: hit and wound modifiers from attacker and target are added and capped at ±1. Crits still use the unmodified roll. +1 save works like −1 rend.</li>
        <li><b>Mortal damage from abilities</b>: “Single roll” (e.g. D3, counts on 2+) or “Per dice” (e.g. M dice = one per model, each 4+ = 1 damage). It ignores the save roll; wards still apply.</li>
        <li><b>Casualties</b> are removed from the standard weapon first; special weapons stay. The points cost stays unchanged for “per 100 points”.</li>
        <li><b>Target from library</b>: takes health, ward, save (highlighted column) and keywords and shows the chance to wipe out the target.</li>
        <li>Other abilities are not included; they are listed in each unit’s collapsible “Abilities & notes” section.</li>
        <li>Save roll = save + rend (enter rend as a positive number, e.g. 1 for −1). Wards are rolled for every damage point, including mortal damage.</li>
        <li>Models slain = floor(damage ÷ health), because excess damage carries over to the next model.</li>
        <li><b>Effective health</b> = models × health ÷ (chance the save fails × chance the ward fails).</li>
        <li><b>per 100 points</b>: all values are divided by the unit’s points cost and multiplied by 100. Same as “per point”, just easier to read. In the matchups it shows “enemy points destroyed per 100 own points”.</li>
      </ul>
      <ul data-only="de">
        <li>Attacken und Schaden akzeptieren Würfel: <code>3</code>, <code>D3</code>, <code>D6+1</code>, <code>2D6</code> (auch <code>W6</code>). Attacken gelten pro Modell, das die Waffe trägt.</li>
        <li>Eine unmodifizierte 1 scheitert immer. Ein unmodifizierter Trefferwurf auf oder über „Crit auf“ (Standard 6+) ist ein Crit und trifft immer.</li>
        <li><b>Champion</b>: +1 Attacke für jede Waffe mit „Champion +1“ (genau ein Modell). Bei Companion-Waffen oder Waffen, die der Champion nicht trägt, abwählen.</li>
        <li><b>Verstärkt</b>: Modelle (Waffen und Defensive) und Punktkosten werden verdoppelt. Eingetragen wird immer die Grundeinheit.</li>
        <li><b>Crit (2 Hits)</b>: 2 Treffer statt 1. <b>Crit (Auto-wound)</b>: kein Verwundungswurf. <b>Crit (Mortal)</b>: Schaden als tödlicher Schaden, kein Verwundungs- und kein Rüstungswurf.</li>
        <li><b>Nahkampf / Fernkampf / Alle</b> (oben rechts): legt fest, welche Waffen in die Berechnung einfließen.</li>
        <li><b>Charge (+1 Damage)</b> zählt bei Nahkampfwaffen, wenn „Angreifer hat angegriffen“ gesetzt ist. <b>Anti-X (+1 Rend)</b> zählt, wenn das Ziel das Schlüsselwort hat (Anti-charge: „Ziel hat angegriffen“). In den Matchups gelten die Schlüsselwörter der Verteidiger.</li>
        <li><b>Modifikatoren</b>: Treffer- und Verwundungsmodifikatoren von Angreifer und Ziel werden addiert und auf ±1 begrenzt. Crits zählen weiter auf den unmodifizierten Wurf. +1 Rüstung wirkt wie −1 Rend.</li>
        <li><b>Tödlicher Schaden aus Fertigkeiten</b>: „Ein Wurf“ (z. B. W3, zählt ab 2+) oder „Pro Würfel“ (z. B. M Würfel = einer pro Modell, je 4+ = 1 Schaden). Er umgeht den Rüstungswurf, Ward gilt.</li>
        <li><b>Verluste</b> werden zuerst von der Standardbewaffnung abgezogen, Sonderwaffen bleiben. Die Punktkosten bleiben für „pro 100 Punkte“ unverändert.</li>
        <li><b>Ziel aus der Bibliothek</b>: übernimmt Lebenspunkte, Ward, Rüstung (markierte Spalte) und Schlüsselwörter und zeigt die Chance, das Ziel auszulöschen.</li>
        <li>Andere Fertigkeiten werden nicht eingerechnet, sie stehen im ausklappbaren Feld „Fertigkeiten & Notizen“ jeder Einheit.</li>
        <li>Rüstungswurf = Save + Rend (Rend positiv eingeben, z. B. 1 für −1). Ward wird für jeden Schadenspunkt einzeln gewürfelt, auch gegen tödlichen Schaden.</li>
        <li>Getötete Modelle = abgerundet(Schaden ÷ Lebenspunkte), da überschüssiger Schaden auf das nächste Modell übergeht.</li>
        <li><b>Effektive Lebenspunkte</b> = Modelle × Lebenspunkte ÷ (Chance, dass der Rüstungswurf misslingt × Chance, dass der Ward misslingt).</li>
        <li><b>pro 100 Punkte</b>: Alle Werte werden durch die Punktkosten der Einheit geteilt und mal 100 genommen. Das ist dasselbe wie „pro Punkt“, nur besser lesbar. Im Matchup steht dann „vernichtete gegnerische Punkte pro 100 eigene Punkte“.</li>
      </ul>
    </details>
  </section>
</main>

<script id="app-script" type="text/x-app">
// ================= Seitengerüst =================
// Das Markup steht in einem <template>, damit die Seite sich selbst unverändert neu veröffentlichen kann.
const PAGE_STYLE = document.getElementById('app-style').textContent;
const PAGE_SHELL = document.getElementById('app-shell').innerHTML;
const PAGE_SCRIPT = document.getElementById('app-script').textContent;
const PAGE_BOOT = document.getElementById('app-boot').textContent;
{ const tpl = document.getElementById('app-shell'); tpl.parentNode.insertBefore(tpl.content.cloneNode(true), tpl.nextSibling); }

// ================= Wahrscheinlichkeits-Mathematik =================
const SAVES = [2, 3, 4, 5, 6, 7]; // 7 = kein Save
const saveLabel = s => s === 7 ? 'kein' : s + '+';

function zeros(n) { return new Array(n).fill(0); }
function trim(d) { let n = d.length; while (n > 1 && d[n - 1] < 1e-13) n--; return n === d.length ? d : d.slice(0, n); }
function conv(a, b) {
  const r = zeros(a.length + b.length - 1);
  for (let i = 0; i < a.length; i++) { const ai = a[i]; if (!ai) continue; for (let j = 0; j < b.length; j++) r[i + j] += ai * b[j]; }
  return r;
}
function mix(parts) {
  const n = Math.max(...parts.map(p => p[1].length)); const r = zeros(n);
  for (const [w, d] of parts) { if (!w) continue; for (let i = 0; i < d.length; i++) r[i] += w * d[i]; }
  return r;
}

// "3", "D3", "D6+1", "2D6", "W6" -> Verteilung (Index = Wert)
function parseDice(str) {
  const s = String(str).toUpperCase().replace(/\s+/g, '').replace(/W/g, 'D');
  if (!s || !/^[0-9D+]+$/.test(s)) return null;
  let dist = [1];
  for (const t of s.split('+')) {
    let m;
    if ((m = t.match(/^(\d*)D(\d+)$/))) {
      const n = m[1] ? +m[1] : 1, f = +m[2];
      if (f < 1 || f > 20 || n < 1 || n > 20) return null;
      const die = [0, ...Array(f).fill(1 / f)];
      for (let i = 0; i < n; i++) dist = conv(dist, die);
    } else if (/^\d+$/.test(t)) {
      const k = +t; if (k > 300) return null;
      const c = zeros(k + 1); c[k] = 1; dist = conv(dist, c);
    } else return null;
  }
  return dist;
}

// Endgültige Wahrscheinlichkeit jeder Würfelseite 1..6 inkl. Wiederholungswurf
function faceProbs(target, reroll, critOn = 7) {
  const t = Math.max(2, target);
  const succ = f => f !== 1 && (f >= t || f >= critOn); // Crits treffen immer
  const R = f => reroll === 'ones' ? f === 1 : reroll === 'failed' ? !succ(f) : false;
  let nR = 0; for (let f = 1; f <= 6; f++) if (R(f)) nR++;
  const p = [0]; for (let f = 1; f <= 6; f++) p[f] = (R(f) ? 0 : 1 / 6) + nR / 36;
  return { p, succ };
}

function binom(n, k) { let r = 1; for (let i = 1; i <= k; i++) r = r * (n - k + i) / i; return r; }
// Ward: jeder Schadenspunkt wird mit Wahrscheinlichkeit q ignoriert
function thin(D, q) {
  if (q <= 0) return D;
  const r = zeros(D.length), keep = 1 - q;
  for (let d = 0; d < D.length; d++) { if (!D[d]) continue; for (let k = 0; k <= d; k++) r[k] += D[d] * binom(d, k) * keep ** k * q ** (d - k); }

}

const failSave = (save, rend) => { const st = save >= 7 ? 99 : save + rend; return 1 - (st > 6 ? 0 : (7 - Math.max(2, st)) / 6); };

function profileDist(pr, ctx) {
  const D = thin(pr._dmg, ctx.wq);
  const critOn = Math.max(2, +pr.critOn || 6);
  const hit = faceProbs(pr.hit, pr.rrHit, critOn);
  let pCrit = 0, pNorm = 0;
  for (let f = 2; f <= 6; f++) if (hit.succ(f)) { if (f >= critOn) pCrit += hit.p[f]; else pNorm += hit.p[f]; }
  const w = faceProbs(pr.wound, pr.rrWound);
  let pw = 0; for (let f = 1; f <= 6; f++) if (w.succ(f)) pw += w.p[f];
  const pu = failSave(ctx.save, pr.rend - (ctx.saveMod || 0));

  const C = mix([[1 - pw * pu, [1]], [pw * pu, D]]);          // normaler Treffer
  let crit;
  switch (pr.crit) {
    case 'two': crit = conv(C, C); break;
    case 'auto': crit = mix([[1 - pu, [1]], [pu, D]]); break;
    case 'mortal': crit = D; break;
    default: crit = C;
  }
  const X = trim(mix([[1 - pNorm - pCrit, [1]], [pNorm, C], [pCrit, crit]])); // eine Attacke

  let A = [1]; for (let i = 0; i < pr.models; i++) A = conv(A, pr._atk);
  if (pr._champ) A = [0, ...A]; // Champion: +1 Attacke
  let total = [A[0]], pow = [1];
  for (let k = 1; k < A.length; k++) {
    pow = trim(conv(pow, X));
    if (A[k]) total = mix([[1, total], [A[k], pow]]);
  }
  return trim(total);
}

function stats(d) {
  let mean = 0, m2 = 0; d.forEach((p, i) => { mean += p * i; m2 += p * i * i; });

  const atLeast = zeros(d.length + 1); for (let i = d.length - 1; i >= 0; i--) atLeast[i] = atLeast[i + 1] + d[i];
  let median = 0; while (median < d.length - 1 && atLeast[median + 1] >= 0.5) median++;
  return { mean, sd, atLeast, median };
}

// Verstärkt verdoppelt Modelle und Punkte, der Champion gibt +1 Attacke.
// ctx beschreibt die Situation: save, wq (Ward), saveMod, hitMod/woundMod (vom Ziel), ignore1, kw (Schlüsselwörter des Ziels), charged, targetCharged.
const phaseOk = w => { const p = ws.phase || 'all'; return p === 'all' || (p === 'ranged') === !!w.ranged; };

const delta = k => { const d = zeros(k + 1); d[k] = 1; return d; };
const shiftDist = (d, k) => d && k > 0 ? conv(d, delta(k)) : d;
const normKw = k => String(k).toLowerCase().replace(/\s*\(.*\)\s*$/, '').replace(/\u2011/g, '-').trim();
const baseModels = u => u.def.models * (u.reinforced ? 2 : 1);
const lostModels = u => Math.min(Math.max(0, parseInt(u.losses) || 0), baseModels(u) - 1);
const effModels = u => baseModels(u) - lostModels(u);
const effPoints = u => (+u.points || 0) * (u.reinforced ? 2 : 1);
const effWeapons = (u, ctx = {}) => {

      _atk: shiftDist(w._atk, +m.atk || 0), _dmg: shiftDist(w._dmg, dmgAdd), _champ: !!u.champion && w.champ !== false };
  });
};

// Zusätzlicher tödlicher Schaden aus einer Fertigkeit (z. B. „nach dem Angriff W3, bei 2+ so viel“ oder „pro Modell ein Würfel, jede 4+ = 1“)
function mwDist(u, ctx) {

  if (a.charge && !ctx.charged) return null;
  const ph = ws.phase || 'all', aph = a.phase || 'melee'; if (aph !== 'any' && ph !== 'all' && aph !== ph) return null;

    const X = parseDice(a.dice || 'D3'); if (!X) return null;
    D = X.map((p, i) => i >= min ? p : 0); D[0] = X.slice(0, Math.max(1, min)).reduce((t, p) => t + p, 0);

    const E = parseDice(a.each || '1'), N = /^m(odelle)?$/i.test(String(a.count || 'M').trim()) ? delta(effModels(u)) : parseDice(a.count);

    for (let k = 1; k < N.length; k++) { pow = trim(conv(pow, Y)); if (N[k]) tot = mix([[1, tot], [N[k], pow]]); }

const MW_NAME = 'Tödlicher Schaden (Fertigkeit)';

function unitDist(u, ctx) {
  if (u._group) { // Gruppe: alle Mitglieder greifen dasselbe Ziel an
    let d = [1]; const parts = [], names = [], c = { ...ctx, ignore1: false };
    for (const m of u._group) { const r = unitDist(m, c); parts.push(r.mean); names.push(m.name); d = trim(conv(d, r.dist)); }
    if (ctx.ignore1 && d.length > 1) d = trim([d[0] + d[1], ...d.slice(2)]);
    return { dist: d, parts, names, ...stats(d) };
  }
  let d = [1]; const parts = [], names = [];
  for (const w of effWeapons(u, ctx)) { const pd = profileDist(w, ctx); parts.push(stats(pd).mean); names.push(w.name); d = trim(conv(d, pd)); }
  const mw = mwDist(u, ctx); if (mw) { parts.push(stats(mw).mean); names.push(MW_NAME); d = trim(conv(d, mw)); }
  if (ctx.ignore1 && d.length > 1) d = trim([d[0] + d[1], ...d.slice(2)]);
  return { dist: d, parts, names, ...stats(d) };
}

const EN_DATA = new Map();
function addEnData(units) {

    if (a.timing_en && a.timing) EN_DATA.set(a.timing.trim(), a.timing_en);
  }
}
function trText(s) {
  const t = s.trim(); if (!t) return null;
  let r = EN[t] ?? EN_DATA.get(t);
  if (r == null) for (const [rx, f] of EN_RX) { const m = t.match(rx); if (m) { r = typeof f === 'string' ? t.replace(rx, f) : f(...(f.length === 1 ? [t] : m)); break; } }
  return r == null || r === t ? null : s.replace(t, r);
}
const trOrig = new WeakMap(), TR_ATTRS = ['placeholder', 'title', 'aria-label'];
function trNode(n) {
  const cur = n.nodeValue, o = trOrig.get(n), de = o && cur === o.en ? o.de : cur;
  if (LANG === 'en') { const en = trText(de); if (en != null) { trOrig.set(n, { de, en }); if (cur !== en) n.nodeValue = en; } }
  else if (o && cur === o.en) { n.nodeValue = o.de; trOrig.delete(n); }
}
function trAttrs(el) {
  let o = trOrig.get(el);
  for (const a of TR_ATTRS) {
    const cur = el.getAttribute(a); if (cur == null) continue;
    const prev = o && o[a], de = prev && cur === prev.en ? prev.de : cur;
    if (LANG === 'en') { const en = trText(de); if (en != null) { o = o || {}; o[a] = { de, en }; trOrig.set(el, o); if (cur !== en) el.setAttribute(a, en); } }
    else if (prev && cur === prev.en) el.setAttribute(a, prev.de);
  }
}
function trTree(root) {
  if (root.nodeType === 3) { if (!root.parentElement || !root.parentElement.closest('script,style,textarea')) trNode(root); return; }
  if (root.nodeType !== 1 || root.matches('script,style,textarea')) return;
  trAttrs(root);
  root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(trAttrs);
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement && n.parentElement.closest('script,style,textarea') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  let n; while ((n = w.nextNode())) trNode(n);
}
new MutationObserver(recs => {

}).observe(document.body, { childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: TR_ATTRS });

function unitSummary(u) {

}

function modSummary(u) {
  const m = u.mods || {}, d = u.dmods || {}, out = [], sg = v => (v > 0 ? '+' : '−') + Math.abs(v);

  if (+m.rend) out.push('+' + m.rend + ' Rend'); if (+m.atk) out.push('+' + m.atk + ' Attacken'); if (+m.dmg) out.push('+' + m.dmg + ' Schaden');
  if (lostModels(u)) out.push(lostModels(u) + ' Verluste');
  if (String(u.group || '').trim()) out.push('Gruppe ' + String(u.group).trim());
  if (u.mw && u.mw.mode && u.mw.mode !== 'none') out.push('+ tödl. Schaden');
  if (d.save) out.push('+1 Rüstung'); if (d.hit) out.push('−1 Treffer gegen sie'); if (d.wound) out.push('−1 Verwunden gegen sie'); if (d.ignore1) out.push('ignoriert 1. Schaden');

}

let modalCancel = null;
function openModal(title, bodyHtml, actions) {
  const m = document.getElementById('modal');
  document.getElementById('modalTitle').textContent = title; m.querySelector('.modal-box').classList.remove('wide');
  document.getElementById('modalBody').innerHTML = bodyHtml;
  const act = document.getElementById('modalActions'); act.innerHTML = '';
  modalCancel = actions.find(a => a.cancel)?.onClick || null;
  for (const a of actions) {
    const b = document.createElement('button'); b.textContent = a.label; if (a.primary) b.className = 'primary';
    b.onclick = () => { if (a.onClick && a.onClick() === false) return; closeModal(); };
    act.appendChild(b);
  }
  m.hidden = false;
  (act.querySelector('.primary') || act.lastChild)?.focus();
}
function closeModal() { document.getElementById('modal').hidden = true; modalCancel = null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('modal').hidden) { modalCancel && modalCancel(); closeModal(); } });
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') { modalCancel && modalCancel(); closeModal(); } });
const askConfirm = (msg, okLabel) => new Promise(res => openModal('Bitte bestätigen', `<p>${esc(msg)}</p>`,
  [{ label: 'Abbrechen', cancel: true, onClick: () => res(false) }, { label: okLabel, primary: true, onClick: () => res(true) }]));

async function saveToLibrary(u) {
  const name = u.name.trim() || 'Ohne Namen';
  const idx = library.findIndex(l => l.name === name);
  if (idx >= 0 && !(await askConfirm(`„${name}“ gibt es schon in der Bibliothek. Überschreiben?`, 'Überschreiben'))) return;
  const entry = { ...clone(u), name, open: false, active: true, savedAt: new Date().toISOString() };
  delete entry.id;
  if (idx >= 0) library[idx] = entry; else library.push(entry);
  library.sort((a, b) => a.name.localeCompare(b.name, 'de'));
  if (saveLib()) toast(`„${name}“ gespeichert`); else toast('Speichern fehlgeschlagen. Bitte „Exportieren“ nutzen.');
  renderLibrary();
}
function renderLibrary() {
  const el = document.getElementById('library');
  if (!library.length) { el.innerHTML = '<div class="hint">Noch keine Einheiten gespeichert. Mit „Speichern“ an einer Einheit legst du sie hier ab.</div>'; return; }
  el.innerHTML = library.map((l, i) => `
    <div class="lib-item">
      <div class="meta"><b title="${esc(l.name)}">${esc(l.name)}</b><span>${l.faction ? esc(l.faction) + ' · ' : ''}${esc(unitSummary(l))}</span></div>
      <button class="small" data-lib="add" data-i="${i}" title="Zum Vergleich hinzufügen">Laden</button>
      <button class="icon" data-lib="del" data-i="${i}" title="Aus der Bibliothek löschen">✕</button>
    </div>`).join('');
}
document.getElementById('library').addEventListener('click', e => {
  const b = e.target.closest('button[data-lib]'); if (!b) return;
  const l = library[+b.dataset.i];
  if (b.dataset.lib === 'add') {
    const u = clone(l); u.id = uid(); u.open = false; u.active = true; delete u.savedAt;
    ws.units.push(u); renderUnits(); compute(); toast(`„${l.name}“ zum Vergleich hinzugefügt`);
  } else {
    askConfirm(`„${l.name}“ aus der Bibliothek löschen?`, 'Löschen').then(ok => {
      if (!ok) return;
      const i = library.indexOf(l); if (i >= 0) library.splice(i, 1);
      saveLib(); renderLibrary(); toast(`„${l.name}“ gelöscht`);
    });
  }
});
function importText(text) {
  try {
    const data = JSON.parse(text);
    const list = Array.isArray(data) ? data : data.library;
    if (!Array.isArray(list)) throw 0;
    let n = 0;
    for (const l of list) {
      if (!l || !l.name || !Array.isArray(l.weapons) || !l.def) continue;
      const idx = library.findIndex(x => x.name === l.name);
      if (idx >= 0) library[idx] = l; else library.push(l);
      n++;
    }
    library.sort((a, b) => a.name.localeCompare(b.name, 'de'));
    saveLib(); renderLibrary(); toast(`${n} Einheit${n === 1 ? '' : 'en'} importiert`);
    return true;
  } catch { toast('Text nicht erkannt. Bitte den kompletten exportierten Text einfügen.'); return false; }
}
function openBackup() {
  const json = JSON.stringify({ app: 'aos-rechner', version: 2, library }, null, 2);
  const local = location.protocol === 'file:';
  openModal('Einheiten sichern oder übertragen', `
    <p class="hint">Das Feld enthält alle gespeicherten Einheiten (${library.length}). Kopiere den Text und füge ihn auf einem anderen Gerät oder bei einer anderen Person hier ein. Dann auf „Text importieren“ tippen. Einheiten mit gleichem Namen werden ersetzt.</p>
    <textarea id="backupText" rows="9" spellcheck="false" aria-label="Sicherung als Text">${esc(json)}</textarea>
    <div class="row">
      <button class="small" id="bCopy">Text kopieren</button>
      <button class="small" id="bClear">Feld leeren zum Einfügen</button>
      ${local ? '<button class="small" id="bSave">Als Datei speichern</button>' : ''}
      <button class="small" id="bLoad">Aus Datei laden</button>
    </div>`,
    [{ label: 'Schließen', cancel: true }, { label: 'Text importieren', primary: true, onClick: () => importText(document.getElementById('backupText').value) }]);
  const ta = document.getElementById('backupText');
  document.getElementById('bCopy').onclick = () => {
    const fallback = () => { ta.focus(); ta.select(); toast('Text markiert. Jetzt kopieren (Cmd/Strg + C).'); };
    try { navigator.clipboard.writeText(ta.value).then(() => toast('Kopiert'), fallback); } catch { fallback(); }
  };
  document.getElementById('bClear').onclick = () => { ta.value = ''; ta.focus(); };
  if (local) document.getElementById('bSave').onclick = () => {
    const blob = new Blob([ta.value], { type: 'application/json' });
    const el = document.createElement('a'); el.href = URL.createObjectURL(blob);
    el.download = 'aos-einheiten-' + new Date().toISOString().slice(0, 10) + '.json'; el.click();
    setTimeout(() => URL.revokeObjectURL(el.href), 1000);
  };
  document.getElementById('bLoad').onclick = () => document.getElementById('importFile').click();
}
document.getElementById('backupLib').onclick = openBackup;

function loadCmp(text, replace) {
  let d; try { d = JSON.parse(text); } catch { toast('Text nicht erkannt.'); return false; }
  const list = Array.isArray(d) ? d : d.units;
  if (!Array.isArray(list) || !list.every(u => u && Array.isArray(u.weapons) && u.def)) { toast('Text nicht erkannt.'); return false; }
  const units = list.map(u => ({ ...clone(u), id: uid(), open: false, active: u.active !== false }));
  if (replace) {
    ws.units = units;
    if (d.target) { ws.target = { ...ws.target, ...d.target, kw: d.target.kw || [] }; document.getElementById('tWard').value = ws.target.ward; document.getElementById('tHealth').value = ws.target.health; document.getElementById('tThresh').value = ws.target.thresh || ''; }
    if ('charged' in d) ws.charged = !!d.charged;
    if (d.phase) ws.phase = d.phase;
  } else ws.units.push(...units);
  renderUnits(); renderToggles(); renderTarget(); compute();
  toast(`${units.length} Einheit${units.length === 1 ? '' : 'en'} geladen`);
}
document.getElementById('shareCmp').onclick = openShareCmp;

function targetCandidates() {
  const seen = new Set(), out = [];
  for (const u of [...ws.units, ...oppTargets(), ...library, ...sharedView().units]) { const l = tLabel(u); if (!seen.has(l) && u.def) { seen.add(l); out.push(u); } }
  return out;
}
function fillTargetList() {
  document.getElementById('tUnitList').innerHTML = targetCandidates().map(u => `<option value="${esc(tLabel(u))}"></option>`).join('');
}
function renderTarget() {
  const t = ws.target;
  document.querySelectorAll('[data-sit]').forEach(c => c.checked = !!ws[c.dataset.sit]);
  document.querySelectorAll('[data-t]').forEach(c => c.checked = !!t[c.dataset.t]);
  document.getElementById('kwChips').innerHTML = TARGET_KW.map(([k, l]) => `<label class="chk"><input type="checkbox" data-kw="${esc(k)}" ${t.kw.includes(k) ? 'checked' : ''}>${l}</label>`).join('');
  document.getElementById('tReinf').checked = !!t.reinf;
  const card = document.getElementById('tCard'), tu = t.unit;
  document.getElementById('tUnit').value = tu ? tLabel(tu) : '';
  card.hidden = !tu;
  if (tu) {
    const r = t.reinf ? 2 : 1;
    card.innerHTML = `<span>Ziel: <b>${esc(tu.name)}</b> · ${tu.models * r} × ${tu.health} LP · Save ${saveLabel(tu.save)}${tu.ward ? ' · Ward ' + tu.ward + '+' : ''}${+tu.points ? ' · ' + (+tu.points * r) + ' Pkt.' : ''}</span><button class="small" id="tClear">Ziel entfernen</button>`;
    document.getElementById('tClear').onclick = () => { delete ws.target.unit; renderTarget(); compute(); };

function setTarget(u) {
  const kws = (u.keywords || []).map(normKw);
  ws.target.unit = { name: u.name, faction: u.faction || '', models: u.def.models, health: +u.def.health, save: +u.def.save, ward: +u.def.ward || 0, points: u.points || '', keywords: u.keywords || [] };
  ws.target.reinf = !!u.reinforced;
  ws.target.ward = String(+u.def.ward || 0); ws.target.health = String(u.def.health);
  document.getElementById('tWard').value = ws.target.ward; document.getElementById('tHealth').value = ws.target.health;
  ws.target.kw = TARGET_KW.map(([k]) => k).filter(k => kws.includes(k));
